  row = document.createElement('div');
  row.id = 'step-row';
  row.style.display = 'none';
  for(let i = 0; i < 16; i++){
    const cell = document.createElement('div');
    cell.className = 'step-cell';
    cell.textContent = String(i + 1);
    cell.dataset.step = i;
    row.appendChild(cell);
  }
  /* insert the step row in the terminal-container, just before the sample
     row. gridEl.parentNode is the dial-cluster, so use the container instead. */
  const tc = document.querySelector('.terminal-container');
  tc.insertBefore(row, sampleEl);
  row.addEventListener('click', e => {
    const cell = e.target.closest('.step-cell'); if(!cell) return;
    stepEdit = +cell.dataset.step;
    paintStepGrid(); paintRing();
  });
}

/* small helper so PLAY/EXPORT reflect whether there's anything to act on:
   PLAY also while the loop runs (to stop it) and in PATTERN (to record into an empty one) */
function updatePlayButton(){
  const has = hasSteps();
  if(playBtn) playBtn.disabled = !(has || running || currentMode === 'pattern');
  if(exportBtn) exportBtn.disabled = !has;
}
function paintPlay(){
  playBtn.classList.toggle('on', running);
  playBtn.textContent = running ? 'STOP' : 'PLAY';
  updatePlayButton();
}

/* ═════════════════════════════════════════════════════════════════════════
   10 · UI WIRING
   ═════════════════════════════════════════════════════════════════════════ */
const gridEl    = document.getElementById('grid');
const sampleEl = document.getElementById('sample-row');
const statusText= document.getElementById('status');
const dot       = document.getElementById('dot');
const tuningEl  = document.getElementById('tuning');
const modeEl    = document.getElementById('mode');
const bendEl    = document.getElementById('bend');
const engineEl  = document.getElementById('engine');
const playBtn   = document.getElementById('play');
const exportBtn = document.getElementById('export');
const midiHeld  = new Map();   /* r14 · rack MIDI notes sounding → the key each lights */

/* build the macro grid from the active labels. Called on init and whenever
   TUNING changes via setTuning() — every bank here is 3×4 (12 buttons), so
   the CSS grid's fixed repeat(3,1fr) matches. r14: each key carries its two
   tones under the label. */
function buildGrid(){
  gridEl.textContent = '';
  const labels = activeLabels();
  const nc = activeCols().length;
  labels.forEach((label, i) => {
    const row = Math.floor(i / nc);
    const col = i % nc;
    const b = document.createElement('div');
    b.className = 'macro';
    const lab = document.createElement('span'), hz = document.createElement('span');
    lab.className = 'lab'; hz.className = 'hz';
    lab.textContent = label;
    b.append(lab, hz);
    b.dataset.row = row; b.dataset.col = col; b.dataset.idx = i;
    gridEl.appendChild(b);
  });
  paintKeyHz();
  for(const i of midiHeld.values()){ const b = gridEl.children[i]; if(b) b.classList.add('midi'); }
  applySpectrumIfActive();
}
/* row·column Hz on every key, swapped under MIRROR as the worklet swaps them */
function paintKeyHz(){
  const rows = activeRows(), cols = activeCols();
  for(const b of gridEl.children){
    const hz = b.querySelector('.hz'); if(!hz) continue;
    let rf = rows[+b.dataset.row], cf = cols[+b.dataset.col];
    if(mirrorMode){ const t = rf; rf = cf; cf = t; }
    hz.textContent = Math.round(rf) + '·' + Math.round(cf);
  }
}
/* a note from the rack sounds, and lights the key it lands on (any octave) */
function midiOn(n, vel){
  send('on', n, vel);
  const i = ((n - 60) % 12 + 12) % 12;
  midiHeld.set(n, i);
  const b = gridEl.children[i]; if(b) b.classList.add('midi');
}
function midiOff(n){
  send('off', n);
  const i = midiHeld.get(n);
  if(i === undefined) return;
  midiHeld.delete(n);
  for(const j of midiHeld.values()) if(j === i) return;
  const b = gridEl.children[i]; if(b) b.classList.remove('midi');
}
function buildSampleRow(){
  for(let i = 0; i < 8; i++){
    const s = document.createElement('div');
    s.className = 'slot'; s.textContent = String(i + 1);
    s.dataset.slot = i;
    sampleEl.appendChild(s);
  }
}

/* MACRO PRESS → DTMF (or selected engine) tone. Hold = sustained; release =
   stop. Pointermove while held = pitch-bend: horizontal drag detunes both
   oscillators by up to ±200 cents (2 semitones), so a held tone can be
   \"wobbled\" with a finger drag — the gesture zone from phase 9, delivered
   early because it's a small addition on top of existing pointer handlers. */

/* xenotype control row state */
let phantomMode = false, spectrumMode = false, droneMode = false, pulseMode = false;
let fractureMode = false, gravityMode = false, stutterMode = false, mirrorMode = false;

async function onMacroDown(b){
  const r = +b.dataset.row, c = +b.dataset.col, idx = b.dataset.idx;

  let rf = activeRows()[r], cf = activeCols()[c];

  /* MIRROR mode — transpose the matrix: swap row and column frequencies
     so pressing (r,c) sounds as (c,r). The matrix flips diagonally. */
  if(mirrorMode){ const tmp = rf; rf = cf; cf = tmp; }

  /* RΛDΛR pitch detune — apply the active radar point's pitch shift to
     both frequencies. radarPitchSemitones is set by radarApply() from the
     active vector point's X position (-12 to +12 semitones). */
  if(radarPitchSemitones){
    const pm = Math.pow(2, radarPitchSemitones / 12);
    rf *= pm; cf *= pm;
  }

  b.classList.add('down');
  /* the voice is the worklet's: it takes ENGINE, MIRROR, the scope's pitch,
     FRACTURE (microtonal cluster copies) and GRAVITY (the ~3 s sink) from
     the same P rows at the press. rf / cf above stay for the readout. */
  const note = 60 + +idx;

  BUTTONS.set(idx, note);
  b._dragX = null; b._t0 = performance.now(); b._t1 = 0;
  const dial = `DIAL ${activeLabels()[idx]} · ${rf.toFixed(0)}/${cf.toFixed(0)}Hz`;
  statusText.textContent = dial;
  if(currentMode === 'step') toggleStepAtCursor(+idx);
  else if(currentMode === 'pattern') patternHit(+idx);
  if(pulseMode) applyPulseGlow();
  if(powered){ send('on', note, 1); return; }
  /* not powered: this press powers us, as r11's first press started its audio */
  await autoPower();
  if(!powered) return;
  if(b._t1){ send('on', note, 1); setTimeout(() => send('off', note), Math.max(60, b._t1 - b._t0)); }   /* lifted while it came up: the tap still sounds */
  else if(BUTTONS.get(idx) === note){ send('on', note, 1); statusText.textContent = dial; }                /* still held */
}
function onMacroMove(b, deltaX){
  const idx = b.dataset.idx;
  const note = BUTTONS.get(idx);
  if(note === undefined) return;
  /* ±200 cents over ~150px of drag. cents = deltaX * (200/75). */
  const cents = Math.max(-200, Math.min(200, deltaX * (200/75)));
  send('bend', note, cents);
}
function onMacroUp(b){
  const idx = b.dataset.idx;
  b._t1 = performance.now();

  const note = BUTTONS.get(idx);
  if(note !== undefined) send('off', note);
  BUTTONS.delete(idx);
  b.classList.remove('down');
  statusText.textContent = BUTTONS.size ? `${BUTTONS.size} held` : (running ? loopWord(true) : 'STANDBY');
  if(pulseMode) applyPulseGlow();
}

/* delegated listeners on the grid container — one handler, not one per
   button, because buttons are rebuilt on tuning change and handlers
   attached to replaced elements quietly stop working (same lesson as
   data_weave's delegated change listener). */
gridEl.addEventListener('pointerdown', e => {
  const b = e.target.closest('.macro'); if(!b) return;
  /* the key keeps the pointer until it lifts — a mouse dragged off a key
     used to leave its note sounding (touch and stylus already did this) */
  try{ b.setPointerCapture(e.pointerId); }catch(_){}
  onMacroDown(b);
});
gridEl.addEventListener('pointerup', e => {
  const b = e.target.closest('.macro'); if(b) onMacroUp(b);
});
gridEl.addEventListener('pointercancel', e => {
  const b = e.target.closest('.macro'); if(b && b.classList.contains('down')) onMacroUp(b);
});
gridEl.addEventListener('pointerleave', e => {
  const b = e.target.closest('.macro');
  if(b && b.classList.contains('down')) onMacroUp(b);
});
/* gesture zone: track drag while a button is held to drive pitch-bend.
   _dragX stores the starting X so pointermove can compute the delta. */
gridEl.addEventListener('pointermove', e => {
  const b = e.target.closest('.macro');
  if(!b || !b.classList.contains('down')) return;
  if(b._dragX === null){ b._dragX = e.clientX; return; }
  const delta = e.clientX - b._dragX;
  if(Math.abs(delta) > 2) onMacroMove(b, delta);
});

/* SAMPLE SLOTS — short-press plays/stops a loaded sample. Long-press (500ms
   hold) records 2 seconds from masterGain into the slot. If a PATTERN is
   loaded and the slot is empty, long-press renders the pattern to a buffer
   instead. Double-click clears a slot.
   Uses a timer to distinguish short from long without a second event.
   r14: while the loop runs a hold arms the slot for one bar from the
   downbeat and a tap cues it there; a tap on a recording slot ends the take,
   on an armed one calls it off. The pattern is rendered (PATTERN or STEP,
   the loop stopped, the slot empty) — playing, the hold records the real
   thing: the loop, the engine, the bends. */
let slotHoldTimer = null, slotHoldFired = false;
sampleEl.addEventListener('pointerdown', e => {
  const s = e.target.closest('.slot'); if(!s) return;
  const slot = +s.dataset.slot;
  slotHoldFired = false;
  slotHoldTimer = setTimeout(() => {
    slotHoldFired = true;
    /* long-press: record or render */
    if(currentMode !== 'live' && !running && hasSteps() && !SAMPLES.has(slot) && !slotSt[slot]){
      renderPatternToBuffer(slot);
    }else{
      recordFromMaster(slot, REC_DUR_MS);
    }
  }, 500);
});
sampleEl.addEventListener('pointerup', e => {
  const s = e.target.closest('.slot'); if(!s) return;
  clearTimeout(slotHoldTimer);
  if(slotHoldFired) return;   /* long-press already handled */
  slotTap(+s.dataset.slot);   /* short-press: play/stop toggle */
});
sampleEl.addEventListener('dblclick', e => {
  const s = e.target.closest('.slot'); if(!s) return;
  const slot = +s.dataset.slot;
  SAMPLES.delete(slot);
  send('smp', 'clr', slot);
  if(!powered) paintSlot(slot);
  statusText.textContent = `slot ${slot + 1} · cleared`;
});

/* PANIC — stop everything now. The worklet drops every voice and slot at
   once, and says so back, so a panic sent by the rack clears this face too.
   r14: this face's PANIC stops its loop as well (a rack's panic leaves the
   rack's transport to the rack). */
document.getElementById('panic').addEventListener('click', () => {
  send('play', 0);
  send('panic');
  panicFace();
});
function panicFace(){
  faceQuiet();
  if(droneMode){ droneMode = false; setP('drn', 0); document.querySelector('[data-xo="drone"]').classList.remove('active'); }
  /* r11 stopped the stutter gate here but left STUTTER lit; now it goes off like DRONE and PHANTOM */
  if(stutterMode){ stutterMode = false; setP('stu', 0); document.body.classList.remove('stutter-mode'); document.querySelector('[data-xo="stutter"]').classList.remove('active'); }
  if(phantomMode){ phantomMode = false; document.body.classList.remove('phantom-mode'); togglePhantomSweep(false); document.querySelector('[data-xo="phantom"]').classList.remove('active'); paintRing(); }
  statusText.textContent = 'PANIC · all stop';
  dot.style.background = 'var(--bend)';
  dot.style.boxShadow = '0 0 10px var(--bend)';
  setTimeout(paintDot, 600);
}
/* the face's share of going quiet (PANIC, ⏻ off, the rack's engine gone):
   keys up, hits unlit; with the engine gone, the loop and the slots too */
function faceQuiet(){
  BUTTONS.clear();
  document.querySelectorAll('.macro.down').forEach(b => b.classList.remove('down'));
  midiHeld.clear();
  gridEl.querySelectorAll('.macro.midi').forEach(b => b.classList.remove('midi'));
  seqGlowsOff();
  pending.clear(); preRoll.length = 0;
  if(!powered){
    running = false; playhead = -1; startReq = false; sweepFree();
    slotSt.fill(0);
    paintPlay(); paintSteps(); paintSlots();
  }
}

/* SELECTORS */
tuningEl.addEventListener('change', e => { setTuning(e.target.value); });

modeEl.addEventListener('change', e => {
  const prevMode = currentMode;
  currentMode = e.target.value;
  pending.clear(); preRoll.length = 0;   /* r14: the loop keeps running across modes — it may be the rack's */
  if(currentMode === 'pattern'){
    statusText.textContent = 'MODE PATTERN · recording';
  }else if(currentMode === 'step'){
    buildStepGrid();
    statusText.textContent = 'MODE STEP · tap cells to place hits';
  }else{
    statusText.textContent = 'MODE ' + currentMode.toUpperCase();
  }
  paintSteps();   /* the step row comes or goes; the ring's cursor with it */
  if(currentMode === 'step' || prevMode === 'step') refit();   /* r13: the step row came or went */
});

bendEl.addEventListener('change', e => {
  statusText.textContent = 'BEND ' + e.target.value.toUpperCase();
  applyBend(e.target.value);
});

engineEl.addEventListener('change', e => {
  currentEngine = e.target.value;
  statusText.textContent = 'ENGINE ' + currentEngine.toUpperCase();
  setP('eng', Math.max(0, ENGINE_KEYS.indexOf(currentEngine)));
});

playBtn.addEventListener('click', () => { togglePlay(); });
exportBtn.addEventListener('click', () => { exportPattern(); });

/* KEYBOARD — arrow keys move the step cursor in STEP mode; space toggles
   playback; Escape = PANIC. Only active in STEP mode for arrows so typing
   in a code editor inside the enclosure doesn't steal keystrokes. */
window.addEventListener('keydown', e => {
  if(e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if(currentMode === 'step'){
    if(e.key === 'ArrowLeft'){ stepEdit = (stepEdit - 1 + 16) % 16; paintStepGrid(); paintRing(); e.preventDefault(); }
    if(e.key === 'ArrowRight'){ stepEdit = (stepEdit + 1) % 16; paintStepGrid(); paintRing(); e.preventDefault(); }
  }
  if(e.key === ' ' && currentMode !== 'live'){
    e.preventDefault();
    if(!e.repeat) togglePlay();
  }
  if(e.key === 'Escape'){
    document.getElementById('panic').click();
  }
});
/* r14: SPACE is the transport, so a focused button (PLAY just clicked) must not also click */
window.addEventListener('keyup', e => {
  if(e.key === ' ' && currentMode !== 'live' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'INPUT') e.preventDefault();
});

/* ═════════════════════════════════════════════════════════════════════════
   XΞNØTYPE SPIRΛL — eight toggle buttons arranged in a spiral around the
   central DTMF grid. They change the pad's behaviour without changing its
   tuning. They are the "alien tech" layer: things the human DTMF pad never
   had. Each is a simple on/off toggle that applies a body class or starts/
   stops a process. The old ABCD modifier column (r08) has been replaced by
   these spiral buttons — the pad is now a pure 3×4 tone matrix.

   PHANTOM (⊗) — stealth + reverse-delay mode. Audio keeps playing, but the
     .down visual state is suppressed (see CSS body.phantom-mode .macro.down).
     The operator can hear what they're dialing but nobody watching the screen
     can see it. The scope's sweep reverses to a violet counter-clockwise beam
     and a 350ms feedback delay engages — the sonic equivalent of falling
     backward through your own echoes on the way down. (r14: the echoes now
     play backwards — two heads read each 350 ms window in reverse.)
   SPECTRUM (◉) — recolors each button based on its row frequency. Lower rows
     glow warm (red/orange), higher rows cool (blue). Applied as a per-button
     inner shadow class. Helps visualize the frequency space at a glance.
   DRONE (⊕) — a low alien drone plays underneath everything you dial. It's a
     pair of detuned sawtooth oscillators at ~55-60Hz through a slow tremolo,
     the sonic equivalent of the deep-signal viewfinder — you can hear the room
     underneath the tones. Kills when toggled off or PANIC.
   PULSE (✦) — bioluminescent glow. The terminal container's box-shadow
     intensifies based on how many buttons are held simultaneously, so the
     whole panel "glows brighter" the more you mash. Pure visual feedback
     tied to the held count. */
const xenoRow = document.getElementById('xo-spiral');

/* ═ ØRBIT SYSTEM — the 8 xenotype glyphs continuously orbit the central
   grid in a logarithmic spiral. Each glyph has its own angle that advances
   per frame via requestAnimationFrame. Long-press (>280ms) GRABS a glyph,
   freezing it in place while the rest keep orbiting. Release resumes orbit
   from the held angle — a game of catch and release. CSS transforms only
   (no left/top writes) to avoid layout thrashing on the Moto G Stylus. */
const ORBIT_SPEED = 0.00028;   /* rad/ms ≈ one orbit per ~22s */
const GRAB_DELAY  = 280;        /* ms: tap vs long-press grab threshold */
const spiralGrowth = 0.02;

let orbitBtns    = [];           /* cached .xo-btn elements */
let glyphAngles  = [];           /* per-glyph angle in radians */
let glyphRX      = [];           /* per-glyph horizontal orbit radius */
let glyphRY      = [];           /* per-glyph vertical orbit radius */
let orbitCenter  = { x: 0, y: 0 };
let orbitRunning = false;
let orbitLastTime = 0;
let orbitRAF     = 0;
/* r13: one record per finger, so a finger holding a glyph is not let go
   when the stylus lifts off a key (r11 kept a single global grab) */
const glyphPtrs  = new Map();     /* pointerId → { btn, idx, t0, timer, grabbed } */
const grabbedIdx = new Set();     /* glyphs frozen in orbit right now */
let orbitSvgLines = [];           /* cached SVG line elements */

function computeOrbitLayout(){
  const cluster = document.querySelector('.dial-cluster');
  const w = cluster.offsetWidth, h = cluster.offsetHeight;
  const gr = gridEl.getBoundingClientRect();
  const cr = cluster.getBoundingClientRect();
  orbitCenter.x = (gr.left - cr.left) + gr.width / 2;
  orbitCenter.y = (gr.top - cr.top) + gr.height / 2;
  const halfW = gr.width / 2, halfH = gr.height / 2;
  /* half a glyph, measured (r13: 46 px on a phone, 34 px elsewhere) */
  const g0 = xenoRow.querySelector('.xo-btn:not(.grabbed)');
  const btnHalf = (g0 && g0.offsetWidth ? g0.offsetWidth : 34) / 2;
  const margin = 16;

  orbitBtns = Array.from(xenoRow.querySelectorAll('.xo-btn'));
  const growthFactor = 1 + (orbitBtns.length - 1) * spiralGrowth;
  const idealR = Math.sqrt(halfW * halfW + halfH * halfH) + btnHalf + margin;

  /* VIEWPORT-BASED horizontal constraint — the orbit may extend beyond the
     cluster into the terminal-container padding area, but must not overflow
     the viewport (body has overflow-x: hidden). cr.left is the cluster's
     offset from the viewport left edge. */
  const maxRX = Math.min(
    orbitCenter.x + cr.left,          /* space to the left of center, in viewport */
    (window.innerWidth - cr.left) - orbitCenter.x  /* space to the right */
  ) - btnHalf - 4;

  /* Vertical — generous. The page scrolls vertically so glyphs can extend
     well beyond the cluster's top/bottom. Cap at a reasonable multiple of
     the grid height to avoid extreme ellipses. */
  let maxRY = Math.max(halfH, orbitCenter.y, h - orbitCenter.y) + 60;
  /* r13 · phone: no page to scroll, so the orbit stays inside the cluster
     (whose padding is sized for exactly this — see the MØBILΞ CSS) */
  if(window.innerWidth <= 480) maxRY = Math.min(orbitCenter.y, h - orbitCenter.y) - btnHalf - 2;

  /* Per-axis FLOOR: glyphs must clear the grid's half-width / half-height
     (not the diagonal — an elliptical orbit can be narrower than the
     diagonal as long as it clears the sides). */
  const floorRX = halfW + btnHalf + 4;
  const floorRY = halfH + btnHalf + 4;

  let baseRX = idealR * growthFactor > maxRX
    ? Math.max(floorRX, Math.min(idealR, maxRX / growthFactor)) : idealR;
  let baseRY = idealR * growthFactor > maxRY
    ? Math.max(floorRY, Math.min(idealR, maxRY / growthFactor)) : idealR;

  if(glyphAngles.length !== orbitBtns.length){
    glyphAngles = [];
    orbitBtns.forEach((b, i) => {
      glyphAngles.push(-Math.PI / 2 + i * (Math.PI * 2 / orbitBtns.length));
    });
  }
  /* always recalculate radii — they change with viewport / cluster size */
  glyphRX = orbitBtns.map((b, i) => baseRX * (1 + i * spiralGrowth));
  glyphRY = orbitBtns.map((b, i) => baseRY * (1 + i * spiralGrowth));

  /* (re)build SVG connector lines */
  const svg = document.getElementById('spiral-lines');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.textContent = '';
  orbitSvgLines = orbitBtns.map(() => {
    const line = document.createElementNS(svg.namespaceURI, 'line');
    line.setAttribute('stroke', 'rgba(176,38,255,0.08)');
    line.setAttribute('stroke-width', '1');
    line.setAttribute('stroke-dasharray', '2,3');
    svg.appendChild(line);
    return line;
  });
}

function orbitLoop(ts){
  if(!orbitRunning) return;
  if(!orbitLastTime) orbitLastTime = ts;
  const dt = Math.min(50, ts - orbitLastTime);   /* cap delta for tab-switch gaps */
  orbitLastTime = ts;

  for(let i = 0; i < orbitBtns.length; i++){
    /* counter-clockwise: angle DECREASES per frame, creating a figure-8
       illusion with the clockwise radar sweep above */
    if(!grabbedIdx.has(i)) glyphAngles[i] -= ORBIT_SPEED * dt;
    const a = glyphAngles[i];
    const rx = glyphRX[i];
    const ry = glyphRY[i];
    const x = orbitCenter.x + Math.cos(a) * rx;
    const y = orbitCenter.y + Math.sin(a) * ry;
    orbitBtns[i].style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`;
    const line = orbitSvgLines[i];
    if(line){
      const lx = orbitCenter.x + Math.cos(a) * (rx - 20);
      const ly = orbitCenter.y + Math.sin(a) * (ry - 20);
      line.setAttribute('x1', lx.toFixed(1));
      line.setAttribute('y1', ly.toFixed(1));
      line.setAttribute('x2', x.toFixed(1));
      line.setAttribute('y2', y.toFixed(1));
    }
  }
  scopeTick(ts);   /* r14: the beam on the playhead, and the pings */
  orbitRAF = requestAnimationFrame(orbitLoop);
}

function startOrbit(){
  if(orbitRunning) return;
  orbitRunning = true;
  orbitLastTime = 0;
  orbitRAF = requestAnimationFrame(orbitLoop);
}

function stopOrbit(){
  orbitRunning = false;
  if(orbitRAF) cancelAnimationFrame(orbitRAF);
}

/* ═ XΞNØ GLYPH INTERACTION — pointer-based tap/grab system.
   TAP (quick press < 280ms): toggles the glyph's mode (same as old click).
   GRAB (long press ≥ 280ms): freezes the glyph in orbit while the rest keep
   orbiting. Release resumes orbit from the held angle. The operator catches
   glyphs with the stylus and releases them back into the orbit. */
function handleXenoToggle(btn){
  const xo = btn.dataset.xo;
  switch(xo){
    case "phantom":
      phantomMode = !phantomMode;
      document.body.classList.toggle('phantom-mode', phantomMode);
      btn.classList.toggle('active', phantomMode);
      togglePhantomSweep(phantomMode);
      paintRing();   /* r14: the steps run anticlockwise with the violet beam */
      statusText.textContent = phantomMode ? 'PHANTOM engaged · reverse delay' : 'PHANTOM off';
      break;
    case "spectrum":
      spectrumMode = !spectrumMode;
      btn.classList.toggle('active', spectrumMode);
      applySpectrumIfActive();
      statusText.textContent = spectrumMode ? 'SPECTRUM vision' : 'SPECTRUM off';
      break;
    case "drone":
      droneMode = !droneMode;
      btn.classList.toggle('active', droneMode);
      setP('drn', droneMode ? 1 : 0);
      if(droneMode) autoPower();
      statusText.textContent = droneMode ? 'DRONE active · drone running' : 'DRONE off';
      break;
    case "pulse":
      pulseMode = !pulseMode;
      btn.classList.toggle('active', pulseMode);
      if(!pulseMode) clearPulseGlow();
      applyPulseGlow();
      statusText.textContent = pulseMode ? 'PULSE glow active' : 'PULSE off';
      break;
    case "fracture":
      fractureMode = !fractureMode;
      document.body.classList.toggle('fracture-mode', fractureMode);
      btn.classList.toggle('active', fractureMode);
      setP('frc', fractureMode ? 1 : 0);
      statusText.textContent = fractureMode ? 'FRACTURE engaged · microtonal clusters' : 'FRACTURE off';
      break;
    case "gravity":
      gravityMode = !gravityMode;
      document.body.classList.toggle('gravity-mode', gravityMode);
      btn.classList.toggle('active', gravityMode);
      setP('grv', gravityMode ? 1 : 0);
      statusText.textContent = gravityMode ? 'GRAVITY pulling · tones sink over time' : 'GRAVITY off';
      break;
    case "stutter":
      stutterMode = !stutterMode;
      document.body.classList.toggle('stutter-mode', stutterMode);
      btn.classList.toggle('active', stutterMode);
      setP('stu', stutterMode ? 1 : 0);
      statusText.textContent = stutterMode ? 'STUTTER active · gate tremolo' : 'STUTTER off';
      break;
    case "mirror":
      mirrorMode = !mirrorMode;
      document.body.classList.toggle('mirror-mode', mirrorMode);
      btn.classList.toggle('active', mirrorMode);
      setP('mir', mirrorMode ? 1 : 0);
      paintKeyHz();   /* r14: the keys show their tones swapped */
      statusText.textContent = mirrorMode ? 'MIRROR transposed · matrix flipped' : 'MIRROR off';
      break;
  }
}

/* wire pointerdown on each glyph — starts the grab timer. Must be called
   after computeOrbitLayout() populates orbitBtns. */
function attachGlyphHandlers(){
  orbitBtns.forEach((btn, idx) => {
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      autoPower();
      /* r13: the glyph keeps this finger until it lifts, and the grab is this
         finger's alone — the stylus playing keys meanwhile does not touch it */
      try{ btn.setPointerCapture(e.pointerId); }catch(_){}
      const g = { btn, idx, t0: performance.now(), timer: 0, grabbed: false };
      g.timer = setTimeout(() => {
        g.timer = 0; g.grabbed = true;
        grabbedIdx.add(idx);
        btn.classList.add('grabbed');
        if(navigator.vibrate) navigator.vibrate(15);
      }, GRAB_DELAY);
      glyphPtrs.set(e.pointerId, g);
    });
  });
}

/* release on window — catches both tap-fire and grab-release, for the
   finger that started it only */
function glyphLift(e, cancelled){
  const g = glyphPtrs.get(e.pointerId);
  if(!g) return;
  glyphPtrs.delete(e.pointerId);
  if(g.timer) clearTimeout(g.timer);
  if(g.grabbed){
    let still = false;
    for(const o of glyphPtrs.values()) if(o.idx === g.idx && o.grabbed) still = true;
    if(!still){ grabbedIdx.delete(g.idx); g.btn.classList.remove('grabbed'); }
  }else if(!cancelled && performance.now() - g.t0 < GRAB_DELAY){
    handleXenoToggle(g.btn);
  }
}
window.addEventListener('pointerup', e => glyphLift(e, false));
window.addEventListener('pointercancel', e => glyphLift(e, true));

/* SPECTRUM — applies per-button inner shadow based on row index */
function applySpectrumIfActive(){
  const macros = gridEl.querySelectorAll('.macro');
  macros.forEach(b => {
    b.classList.remove('spectrum-0','spectrum-1','spectrum-2','spectrum-3');
    if(spectrumMode) b.classList.add('spectrum-' + b.dataset.row);
  });
}

/* DRONE · FRACTURE · GRAVITY · STUTTER — their sound is in WORKLET_SRC now,
   switched by the glyphs above through P rows drn / frc / grv / stu:
     DRONE    saws at 55 and 58.3 Hz under a 0.15 Hz tremolo, level 0.06,
              in on tau 0.5 s, out on tau 0.3 s
     FRACTURE row copies at ±7 and ±15 cents and a column copy at -12 cents,
              on the voice's own envelope
     GRAVITY  row and column glide to half their pitch on tau 0.8 s (~3 s)
     STUTTER  the gate between LEVEL and BEND, closed 40 ms + 10 ms per held
              key on an 80 ms clock, as r11 scheduled it */

/* PULSE — the terminal container glows brighter with more held buttons */
function applyPulseGlow(){
  if(!pulseMode) return;
  const count = BUTTONS.size;
  const intensity = Math.min(1, count * 0.15);
  const container = document.querySelector('.terminal-container');
  if(container){
    container.style.boxShadow =
      `0 0 ${30 + intensity * 60}px rgba(255,61,139,${0.12 + intensity * 0.3}), inset 0 0 15px rgba(0,0,0,0.8)`;
  }
}
function clearPulseGlow(){
  const container = document.querySelector('.terminal-container');
  if(container) container.style.boxShadow = '';
}

/* ═════════════════════════════════════════════════════════════════════════
   DRØP-NΛUT SCØPΞ — vector field HUD controller
   ═════════════════════════════════════════════════════════════════════════
   A circular display with draggable vector points. Each point's position
   maps to audio parameters:
     X (horizontal, 0=left → 1=right):
       · stereo pan (-1 → +1)
       · reverb send (0 → 0.7 wet)
       · pitch detune (-12 → +12 semitones)
     Y (vertical, 0=bottom → 1=top):
       · filter cutoff (50Hz → 12kHz, exponential)
       · output gain (0 → 1.2)
   Multiple vector points coexist; the ACTIVE point (last clicked) drives
   the live parameters. Inactive points are "presets" you can snap to.

   Audio chain: ... → FX chain → radarFilter → radarPanner → radarGain → outNode
   Reverb is a parallel send: FX → convolver → wetGain → radarPanner
   Pitch detune is applied at voice creation time via radarPitchSemitones. */

const radarEl = document.getElementById('radar');
const radarPointsG = document.getElementById('radar-points');
const radarReadout = document.getElementById('radar-readout');

let radarPoints = [
  { x: 0.5, y: 0.5, label: 'α' },
  { x: 0.2, y: 0.8, label: 'β' },
  { x: 0.8, y: 0.3, label: 'γ' },
];
let radarActiveIdx = 0;
let radarDragIdx = null;

let radarPitchSemitones = 0;

/* read the active point's X/Y → update audio params + readout */
function radarApply(){
  const p = radarPoints[radarActiveIdx];
  if(!p) return;
  const x = Math.max(0, Math.min(1, p.x));
  const y = Math.max(0, Math.min(1, p.y));
  paintReadout();
  /* X axis: stereo pan (-1 → +1), reverb wet (0 → 0.6), pitch (-12 → +12 semi)
     Y axis: filter cutoff (50Hz → 12kHz exp), output gain (0.2 → 1.2)
     — the worklet applies both from P rows rdx / rdy, gliding on tau 50 ms */
  setP('rdx', x);
  setP('rdy', y);
  /* pitch detune for new voices (the worklet reads the same from rdx) */
  radarPitchSemitones = Math.round((x - 0.5) * 24);
}
/* r14 · the readout names what the point does, not where it is: pan, reverb
   and pitch from X, cutoff and gain from Y — the worklet's own numbers —
   each value held to its widest, so the line holds still while a point is
   dragged. Two lines; one on the phone. */
function paintReadout(){
  const p = radarPoints[radarActiveIdx];
  if(!radarReadout || !p) return;
  const x = Math.max(0, Math.min(1, p.x)), y = Math.max(0, Math.min(1, p.y));
  const pan = Math.round((2 * x - 1) * 100), semi = Math.round((x - 0.5) * 24), cut = 50 * Math.pow(240, y);
  const val = (t, w) => { const s = document.createElement('span'); s.className = 'val'; s.textContent = t.padEnd(w); return s; };
  const l1 = document.createElement('span'), sep = document.createElement('span'), l2 = document.createElement('span');
  l1.className = 'ro-l'; l2.className = 'ro-l'; sep.className = 'ro-sep'; sep.textContent = ' · ';
  l1.append('PAN ', val(pan === 0 ? 'C' : (pan < 0 ? 'L' : 'R') + Math.abs(pan), 4),
            ' · VERB ', val(Math.round(x * 60) + '%', 3),
            ' · PITCH ', val((semi > 0 ? '+' : '') + semi, 3));
  l2.append('CUT ', val(cut >= 1000 ? (cut / 1000).toFixed(1) + 'K' : String(Math.round(cut)), 5),
            ' · GAIN ', val((0.2 + y).toFixed(2), 4), ' · ' + p.label);
  radarReadout.replaceChildren(l1, sep, l2);
}

/* the radar chain — radarFilter → radarPanner → PHANTOM delay → radarGain →
   limiter, with r11's convolver as the parallel wet send — is WORKLET_SRC's
   scope stage. The SAFETY LIMITER reasoning stands: several held voices,
   FRACTURE's five extra partials a key, the drone, ECHO's 40% and PHANTOM's
   45% feedback and radarGain up to 1.2× all sum there, on a phone, likely on
   headphones — so the worklet keeps r11's -3 dB / 20:1 limiter, then ceil1. */

/* toggle the phantom sweep + reverse-delay on or off: the sweep here, the
   350 ms / 45% delay in the worklet (P row phm) — r14 reads it backwards */
function togglePhantomSweep(on){
  radarEl.classList.toggle('phantom-sweep', on);
  setP('phm', on ? 1 : 0);
}

/* render the vector points on the SVG */
function radarRender(){
  if(!radarPointsG) return;
  radarPointsG.textContent = '';
  radarPoints.forEach((p, i) => {
    const cx = 10 + p.x * 180;
    const cy = 190 - p.y * 180;
    const c = document.createElementNS(radarPointsG.namespaceURI, 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', i === radarActiveIdx ? 7 : 5);
    c.setAttribute('class', 'radar-pt' + (i === radarActiveIdx ? ' active' : ''));
    c.dataset.idx = i;
    radarPointsG.appendChild(c);
    const lbl = document.createElementNS(radarPointsG.namespaceURI, 'text');
    lbl.setAttribute('x', cx); lbl.setAttribute('y', cy + 2);
    lbl.setAttribute('class', 'radar-pt-label');
    lbl.textContent = p.label;
    radarPointsG.appendChild(lbl);
  });
}

/* radar interaction: click to select + drag vector points */
let radarDragging = false;
let radarPtr = null;   /* r13: the pointer that is dragging — a stylus elsewhere does not end the drag */
radarEl.addEventListener('pointerdown', e => {
  const pt = e.target.closest('.radar-pt');
  if(pt){
    radarActiveIdx = +pt.dataset.idx;
    radarDragIdx = radarActiveIdx;
    radarDragging = true;
    radarPtr = e.pointerId;
    try{ radarEl.setPointerCapture(e.pointerId); }catch(_){}
    pt.classList.add('dragging');
  }else{
    /* clicking empty radar space moves the ACTIVE point there */
    const rect = radarEl.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = 1 - (e.clientY - rect.top) / rect.height;
    radarPoints[radarActiveIdx].x = Math.max(0, Math.min(1, x));
    radarPoints[radarActiveIdx].y = Math.max(0, Math.min(1, y));
  }
  radarRender();
  radarApply();
});
radarEl.addEventListener('pointermove', e => {
  if(!radarDragging || radarDragIdx === null || e.pointerId !== radarPtr) return;
  const rect = radarEl.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = 1 - (e.clientY - rect.top) / rect.height;
  radarPoints[radarDragIdx].x = Math.max(0, Math.min(1, x));
  radarPoints[radarDragIdx].y = Math.max(0, Math.min(1, y));
  radarRender();
  radarApply();
});
function radarLift(e){
  if(e.pointerId !== radarPtr) return;
  radarDragging = false;
  radarDragIdx = null;
  radarPtr = null;
  /* remove dragging class from all points */
  radarPointsG.querySelectorAll('.radar-pt.dragging').forEach(p => p.classList.remove('dragging'));
}
window.addEventListener('pointerup', radarLift);
window.addEventListener('pointercancel', radarLift);

/* ═ r14 · THΞ RING IS THΞ SΞQUΞNCΞ ═ sixteen ticks round the scope's rim,
   one a step from twelve o'clock: a placed key lit signal-green, the step
   playing magenta, the STEP cursor a magenta dot inside the ring — the step
   row's own colours. PHANTOM lays them anticlockwise, with its beam. While
   the loop runs the sweep IS the playhead, gliding through each step;
   stopped, it scans on r11's 4 s turn. A point pings as the beam crosses it. */
const SVGNS = radarEl.namespaceURI;   /* the inline <svg>'s own namespace: no URL in the page for VΞILPØINT to read as a host */
const ringG = document.getElementById('radar-ring');
const pingG = document.getElementById('radar-pings');
const SWEEPS = Array.from(radarEl.querySelectorAll('.radar-sweep, .radar-sweep-fan, .radar-sweep-phantom, .radar-sweep-phantom-fan'));
const sweepLine = radarEl.querySelector('.radar-sweep'), sweepLinePh = radarEl.querySelector('.radar-sweep-phantom');
const ringTicks = [], pingRings = [];
let ringCursor = null;
function buildRing(){
  for(let k = 0; k < 16; k++){ const l = document.createElementNS(SVGNS, 'line'); ringG.appendChild(l); ringTicks.push(l); }
  ringCursor = document.createElementNS(SVGNS, 'circle');
  ringCursor.setAttribute('r', '2.2'); ringCursor.setAttribute('class', 'ring-cursor');
  ringG.appendChild(ringCursor);
  radarPoints.forEach(() => {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('class', 'radar-ping'); c.setAttribute('r', '0'); c.style.display = 'none';
    pingG.appendChild(c); pingRings.push(c);
  });
}
/* step k's point at radius r */
function ringAt(k, r){
  const a = (phantomMode ? -k : k) * Math.PI / 8;
  return [100 + r * Math.sin(a), 100 - r * Math.cos(a)];
}
function paintRing(){
  if(!ringTicks.length) return;
  for(let k = 0; k < 16; k++){
    const v = stepVal(k), ph = running && k === playhead;
    const [x1, y1] = ringAt(k, ph ? 90 : (v > 0 ? 91 : 92.5)), [x2, y2] = ringAt(k, ph ? 99 : (v > 0 ? 98 : 96));
    const l = ringTicks[k];
    l.setAttribute('x1', x1.toFixed(1)); l.setAttribute('y1', y1.toFixed(1));
    l.setAttribute('x2', x2.toFixed(1)); l.setAttribute('y2', y2.toFixed(1));
    l.setAttribute('class', 'ring-tick' + (k % 4 === 0 ? ' beat' : '') + (v > 0 ? ' hit' : '') + (ph ? ' ph' : '') + (k >= lenN() ? ' off' : ''));
  }
  if(currentMode === 'step'){
    const [cx, cy] = ringAt(stepEdit, 86);
    ringCursor.setAttribute('cx', cx.toFixed(1)); ringCursor.setAttribute('cy', cy.toFixed(1));
    ringCursor.style.display = '';
  }else ringCursor.style.display = 'none';
}
/* the beam: held on the playhead while the loop runs, r11's CSS turn otherwise */
let sweepHeld = false;
function sweepTo(deg){
  const t = 'rotate(' + deg.toFixed(2) + 'deg)';
  for(const el of SWEEPS){ el.style.animation = 'none'; el.style.transform = t; }
  sweepHeld = true;
}
function sweepFree(){
  if(!sweepHeld) return;
  for(const el of SWEEPS){ el.style.animation = ''; el.style.transform = ''; }
  sweepHeld = false;
}
let beamAnim = null, beamAnimPh = null;
function cssBeam(el, ph){
  let a = ph ? beamAnimPh : beamAnim;
  if(!a || a.playState === 'idle'){
    a = (el && el.getAnimations) ? (el.getAnimations()[0] || null) : null;
    if(ph) beamAnimPh = a; else beamAnim = a;
  }
  return (a && typeof a.currentTime === 'number') ? (a.currentTime % 4000) / 4000 : null;
}
/* where the beam points now, in degrees clockwise from twelve (negative: anticlockwise) */
function beamDeg(){
  if(running && playhead >= 0){
    const f = Math.min(1, (performance.now() - lastStepAt) / stepMs(playhead));
    return (phantomMode ? -1 : 1) * (playhead + f) * 22.5;
  }
  const f = cssBeam(phantomMode ? sweepLinePh : sweepLine, phantomMode);
  return f === null ? null : (phantomMode ? -f * 360 : f * 360);   /* the phantom keyframes turn 360 → 0 */
}
const deg360 = a => { a %= 360; return a < 0 ? a + 360 : a; };
const pingAt = [-1e9, -1e9, -1e9];
let lastBeam = null;
/* once a frame, from the orbit loop */
function scopeTick(now){
  const deg = beamDeg();
  if(running && playhead >= 0 && deg !== null) sweepTo(deg); else sweepFree();
  if(deg !== null && lastBeam !== null){
    const dir = phantomMode ? -1 : 1, swept = deg360(dir * (deg - lastBeam));
    if(swept > 0 && swept < 90){
      radarPoints.forEach((p, i) => {
        const th = Math.atan2(p.x - 0.5, p.y - 0.5) * 180 / Math.PI;
        if(deg360(dir * (th - lastBeam)) <= swept) pingAt[i] = now;
      });
    }
  }
  lastBeam = deg;
  for(let i = 0; i < pingRings.length; i++){
    const c = pingRings[i], age = now - pingAt[i], p = radarPoints[i];
    if(age >= 0 && age < 600 && p){
      const f = age / 600;
      c.setAttribute('cx', (10 + p.x * 180).toFixed(1)); c.setAttribute('cy', (190 - p.y * 180).toFixed(1));
      c.setAttribute('r', (7 + f * 10).toFixed(1)); c.style.opacity = (0.8 * (1 - f)).toFixed(2);
      if(c.style.display) c.style.display = '';
    }else if(!c.style.display) c.style.display = 'none';
  }
}

/* ═════════════════════════════════════════════════════════════════════════
   11 · WHΛT THΞ RΛCK SΛYS — srcd-duo, from the rack that mounted us only
   ═════════════════════════════════════════════════════════════════════════
   r11 handled srcd-omni weave traffic here (chrome, ident-req, status-req,
   targets, transport, routes, score-request). A module hears the r158 set:
   the worklet's replies (wl-msg — the loop's run / step, the slots, panics;
   see fromWorklet), tap-power, pwr-request, midi-note, bpm, wl-dead.
   The gate in the shared header admits by window and origin; the explicit
   check below stays as the contract asks. */
window.addEventListener('message', e => {
  if (window.parent !== window && !srcdAdmit(e)) return;
  const d = e.data; if(!d || d.src !== 'srcd-duo') return;
  if(d.cmd === 'wl-msg'){
    if(d.mod !== undefined && d.mod !== SRCD_MOD) return;
    if(node && node.port && typeof node.port.onmessage === 'function') node.port.onmessage({ data: d.m });
    return;
  }
  /* the rack's module row shows this module's name: the page's own title steps aside while it does. The page's ⏻ stays —
     some racks (STRΛTΛ) draw no power control for a module, and a module that is off can only be woken from its ⏻ */
  if(d.cmd === 'chrome-header'){ document.body.classList.toggle('omni-chromed', !!d.hide); return; }
  if(d.cmd === 'tap-power'){ powered ? powerOff() : powerOn(); return; }
  if(d.cmd === 'pwr-request'){ pwrSay(); return; }
  if(d.cmd === 'midi-note'){
    if(!powered) return;
    const n = d.note | 0;
    if(!(n >= 0 && n < 128)) return;
    if(d.on && !(d.vel !== undefined && +d.vel <= 0)) midiOn(n, d.vel === undefined ? 0.8 : +d.vel); else midiOff(n);
    return;
  }
  /* the rack's tempo: the loop follows it, re-timed on its next step */
  if(d.cmd === 'bpm'){ const b = +d.bpm; if(b > 0){ setP('bpm', b); paintFader('bpm'); } return; }
  if(d.cmd === 'wl-dead'){
    powered = false; node = null; faceQuiet(); pwrPaint(); pwrSay();
    statusText.textContent = '✕ the engine stopped in the rack';
    return;
  }
});

/* ═ CFG — the config panel r11 left a placeholder for (phase 9), r14 ═
   One range per P row it shapes, the number beside it the number sent.
   On the phone it lies over the selectors and the scope (placeConfig),
   so the keys can be played while it is open. */
const configEl = document.getElementById('config');
const cfgBtn = document.getElementById('cfg');
const FADERS = new Map();   /* P key → { r, out, fmt } */
const msTxt = s => s < 1 ? Math.round(s * 1000) + ' ms' : s.toFixed(2) + ' s';
const pctTxt = v => Math.round(v * 100) + '%';
const CFG_ROWS = [
  ['lvl', 'LEVEL',   pctTxt],
  ['atk', 'ATTACK',  v => msTxt(0.0015 * Math.pow(2000, v))],   /* the worklet's ramp, 1.5 ms – 3 s */
  ['rel', 'RELEASE', v => msTxt(0.005 * Math.pow(400, v))],    /* its time constant, 5 ms – 2 s */
  ['amt', 'AMOUNT',  pctTxt],
  ['bpm', 'BPM',     v => String(Math.round(v)), 1],
  ['gat', 'GATE',    pctTxt, 0.01],
  ['swg', 'SWING',   pctTxt, 0.01],
  ['crw', 'ROW HZ',  v => String(Math.round(v)), 1],
  ['ccl', 'COL HZ',  v => String(Math.round(v)), 1],
  ['cst', 'RATIO',   v => '×' + v.toFixed(3), 0.001],
  ['twi', 'TWIST',   v => (v > 0.001 ? '+' : v < -0.001 ? '−' : '') + Math.round(Math.abs(v) * 24) + ' dB', 1 / 24]   /* column against row, DTMF engine */
];
function buildConfig(){
  for(const [k, name, fmt, step] of CFG_ROWS){
    const q = P[PIX[k]];
    const lab = document.createElement('label'), nm = document.createElement('span');
    const r = document.createElement('input'), out = document.createElement('output');
    lab.className = 'cfg-fd'; nm.textContent = name;
    r.type = 'range'; r.min = String(q.min); r.max = String(q.max); r.step = String(step || (q.max - q.min) / 200);
    r.value = String(state.p[PIX[k]]);
    r.addEventListener('input', () => cfgSet(k, name, +r.value));
    lab.append(nm, out, r);
    configEl.appendChild(lab);
    FADERS.set(k, { r, out, fmt });
    paintFader(k);
  }
  const row = document.createElement('div'), rnd = document.createElement('button'), clr = document.createElement('button');
  row.className = 'cfg-btns';
  rnd.className = 'btn'; rnd.type = 'button'; rnd.textContent = 'RANDOM'; rnd.title = 'dial a random number into the sixteen steps';
  clr.className = 'btn'; clr.type = 'button'; clr.textContent = 'CLEAR'; clr.title = 'clear the sixteen steps';
  rnd.addEventListener('click', randomSteps);
  clr.addEventListener('click', clearSteps);
  row.append(rnd, clr);
  configEl.appendChild(row);
}
function paintFader(k){
  const f = FADERS.get(k); if(!f) return;
  const v = state.p[PIX[k]];
  if(Math.abs(+f.r.value - v) > 1e-9) f.r.value = String(v);
  f.out.textContent = f.fmt(v);
}
function cfgSet(k, name, v){
  if(k === 'twi') v = Math.round(v * 24) / 24 + 0;   /* whole dB; the +0 turns -0 into 0 */
  setP(k, v);
  paintFader(k);
  if(k === 'crw' || k === 'ccl' || k === 'cst') applyCustomBank();
  statusText.textContent = name + ' ' + FADERS.get(k).fmt(state.p[PIX[k]]);
}
/* phone: from the selectors' top to the readout's foot; elsewhere, below the slots as r11 placed it */
function placeConfig(){
  if(!configEl.classList.contains('open') || window.innerWidth > 480){ configEl.style.top = ''; configEl.style.height = ''; return; }
  const tc = document.querySelector('.terminal-container').getBoundingClientRect();
  const a = document.querySelector('.controls').getBoundingClientRect();
  const b = document.querySelector('.radar-wrap').getBoundingClientRect();
  configEl.style.top = (a.top - tc.top) + 'px';
  configEl.style.height = Math.max(120, b.bottom - a.top) + 'px';
  /* a phone whose fonts or rounding make the fields a little taller than this region: grow the panel (down over the top of
     the orbit, never past the face) to hold its buttons whole, rather than clip their bottom edge and scroll */
  const over = configEl.scrollHeight - configEl.clientHeight;
  if(over > 0){
    const room = tc.bottom - a.top - 4;
    configEl.style.height = Math.min(configEl.offsetHeight + over + 1, Math.max(room, configEl.offsetHeight)) + 'px';
  }
}
/* ═ LEN — how many of the sixteen steps the loop plays ═
   A continuous slide (step=any): the thumb is never notched. The worklet takes the nearest whole step, so the loop
   changes length on the beat while it plays; the galaxy takes the unrounded value, so the zoom is smooth too. */
const lenEl = document.getElementById('len'), lenOut = document.getElementById('len-out');
const lenN = () => Math.max(1, Math.min(16, Math.round(state.p[PIX.len])));
function initLen(){ lenEl.value = String(state.p[PIX.len]); lenOut.textContent = String(lenN()); galaxyTo((state.p[PIX.len] - 1) / 15, true); }
lenEl.addEventListener('input', () => {
  const v = +lenEl.value, n = Math.max(1, Math.min(16, Math.round(v)));
  if(n !== lenN()){
    setP('len', n); paintSteps();
    statusText.textContent = 'LENGTH · ' + n + (n === 1 ? ' step' : ' steps');
  }
  lenOut.textContent = String(n);
  galaxyTo((v - 1) / 15);
});

/* ═ GALAXY — the backdrop LEN moves ═
   A spiral galaxy painted once (deterministic: three arms of stars, a bright core, soft gas, in the face's own
   cyan · teal · violet · magenta) onto a canvas behind the face. Sliding LEN scales that picture — out to the whole
   galaxy at 16 steps, in toward the core at 1 — with a slow twist as it goes, eased so the sky never feels notched.
   Nothing runs while the slider is still: a transform on one layer, only while you slide. */
const galaxyBox = document.getElementById('galaxy-zoom'), galaxyCv = document.getElementById('galaxy-img');
const GX = { size: 1024, out: 0.5, inn: 3.5, t: 1, to: 1, raf: 0, last: 0 };
const REDUCE_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function buildGalaxy(){
  const S = GX.size, g = galaxyCv.getContext('2d'); if(!g) return;
  galaxyCv.width = S; galaxyCv.height = S;
  let seed = 20261024; const rnd = () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296;
  const gau = () => (rnd() + rnd() + rnd() + rnd() - 2) * 1.2;
  const C = S / 2, R = S * 0.47, K = 2.3, ARMS = 3, TWO_PI = Math.PI * 2;
  const arm = (i, r, spread) => (i % ARMS) * TWO_PI / ARMS + K * Math.log(r / (0.06 * R)) + gau() * spread;
  /* colour by distance from the core: white-cyan, cyan to teal, violet to magenta */
  const hue = (t) => t < 0.28 ? [235, 250, 255] : t < 0.6 ? (rnd() < 0.6 ? [0, 229, 255] : [57, 255, 180]) : (rnd() < 0.7 ? [176, 38, 255] : [255, 61, 139]);
  g.globalCompositeOperation = 'lighter';
  let gr = g.createRadialGradient(C, C, 0, C, C, R * 1.08);
  gr.addColorStop(0, 'rgba(40,110,160,0.20)'); gr.addColorStop(0.55, 'rgba(70,40,130,0.08)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  for(let i = 0; i < 340; i++){                                    /* gas along the arms */
    const r = R * (0.12 + 0.85 * Math.pow(rnd(), 0.9)), a = arm(i, r, 0.16);
    const x = C + r * Math.cos(a), y = C + r * Math.sin(a), rad = 14 + rnd() * 34 * (0.5 + r / R), c = hue(r / R);
    gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(' + c + ',' + (0.035 + rnd() * 0.05).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(' + c + ',0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  for(let i = 0; i < 5200; i++){                                   /* the arms' stars */
    const r = R * (0.04 + 0.96 * Math.pow(rnd(), 1.5)), a = arm(i, r, 0.10 + 0.28 * (r / R));
    const x = C + r * Math.cos(a), y = C + r * Math.sin(a), c = hue(r / R), sz = 0.5 + rnd() * rnd() * 2.0;
    g.fillStyle = 'rgba(' + c + ',' + (0.25 + rnd() * 0.65).toFixed(2) + ')';
    g.beginPath(); g.arc(x, y, sz, 0, TWO_PI); g.fill();
  }
  for(let i = 0; i < 700; i++){                                    /* the faint halo between them */
    const r = R * 1.05 * Math.sqrt(rnd()), a = rnd() * TWO_PI;
    g.fillStyle = 'rgba(200,225,255,' + (0.08 + rnd() * 0.22).toFixed(2) + ')';
    g.fillRect(C + r * Math.cos(a), C + r * Math.sin(a), 1, 1);
  }
  for(let i = 0; i < 40; i++){                                     /* a few bright stars, glowing */
    const r = R * (0.1 + 0.85 * rnd()), a = arm(i, r, 0.25), x = C + r * Math.cos(a), y = C + r * Math.sin(a), c = hue(r / R);
    gr = g.createRadialGradient(x, y, 0, x, y, 9);
    gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(0.25, 'rgba(' + c + ',0.45)'); gr.addColorStop(1, 'rgba(' + c + ',0)');
    g.fillStyle = gr; g.fillRect(x - 9, y - 9, 18, 18);
  }
  gr = g.createRadialGradient(C, C, 0, C, C, R * 0.3);              /* the core */
  gr.addColorStop(0, 'rgba(235,252,255,0.95)'); gr.addColorStop(0.14, 'rgba(0,229,255,0.55)'); gr.addColorStop(0.5, 'rgba(176,38,255,0.18)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
}
function galaxyPaint(){
  const s = GX.inn * Math.pow(GX.out / GX.inn, GX.t), rot = (1 - GX.t) * 70;
  galaxyBox.style.transform = 'rotate(' + rot.toFixed(2) + 'deg) scale(' + s.toFixed(4) + ')';
}
/* zoomed out, the whole galaxy spans the panel; zoomed in, seven times closer */
function galaxyFit(){
  const tc = document.querySelector('.terminal-container');
  const D = Math.max(tc.clientWidth * 1.1, tc.clientHeight * 0.75);
  GX.out = D / (GX.size * 0.94); GX.inn = GX.out * 7;
  galaxyPaint();
}
function galaxyStep(now){
  GX.raf = 0;
  const dt = Math.min(64, now - (GX.last || now)); GX.last = now;
  const d = GX.to - GX.t;
  if(Math.abs(d) < 0.0005){ GX.t = GX.to; GX.last = 0; galaxyPaint(); return; }
  GX.t += d * (1 - Math.exp(-dt / 110));
  galaxyPaint();
  GX.raf = requestAnimationFrame(galaxyStep);
}
function galaxyTo(t, instant){
  GX.to = t;
  if(instant || REDUCE_MOTION){ GX.t = t; galaxyPaint(); return; }
  if(!GX.raf){ GX.last = 0; GX.raf = requestAnimationFrame(galaxyStep); }
}
function toggleConfig(open){
  configEl.classList.toggle('open', open);
  cfgBtn.classList.toggle('on', open);
  cfgBtn.setAttribute('aria-pressed', open ? 'true' : 'false');
  placeConfig();
}
cfgBtn.addEventListener('click', () => toggleConfig(!configEl.classList.contains('open')));

/* r13 · PHONE FIT — in portrait on a phone the face is sized to the screen
   it is on, so nothing scrolls: --key and --radar are set by measurement.
   The keys give way first (47 → 40 px), then the scope (→ 120 px), then the
   keys again (→ 36 px), then the scope (→ 90 px). The glyphs keep 46 px.
   Wider than 480 px (desktop, landscape) r11's layout stands as it was. */
const FIT = { kMax: 47, kMid: 40, kMin: 36, rMax: 200, rMid: 120, rMin: 90 };
function fitPhone(){
  const rs = document.documentElement.style;
  if(window.innerWidth > 480){ rs.removeProperty('--key'); rs.removeProperty('--radar'); return; }
  const tc = document.querySelector('.terminal-container');
  const over = () => document.body.getBoundingClientRect().bottom + window.scrollY - window.innerHeight;
  let k = FIT.kMax, r = Math.min(FIT.rMax, tc.clientWidth - 24);
  const set = () => { rs.setProperty('--key', k + 'px'); rs.setProperty('--radar', r + 'px'); };
  set();
  let o = over();
  while(o > 0 && k > FIT.kMid){ k--; set(); o = over(); }
  if(o > 0){ r = Math.max(FIT.rMid, r - Math.ceil(o)); set(); o = over(); }
  while(o > 0 && k > FIT.kMin){ k--; set(); o = over(); }
  if(o > 0){ r = Math.max(FIT.rMin, r - Math.ceil(o)); set(); }
}
/* refit after anything that changes the face's height (resize, the STEP row) */
function refit(){
  fitPhone();
  galaxyFit();
  stopOrbit();
  computeOrbitLayout();
  startOrbit();
  placeConfig();
}

});
