<title>I/Ø // GLØTCH_DIΛL</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  ═ GLØTCH_DIΛL · build r14 — DRØP-NΛUT face on the SRC-D r158 module contract ═
  ═ A circuit-bent, DTMF-inspired glitch tone generator · user-rack module ═

  ═══════════════════════════════════════════════════════════════════════════
  WHAT THIS IS
  ═══════════════════════════════════════════════════════════════════════════
  A circuit-bent, DTMF-inspired glitch tone generator, built as an SRC-D r158
  module: one file that runs on its own (opened directly) AND as a face in an
  ØMNI_FRΛMΞ user rack. Slot glitch_dial · processor usr-glitch-dial.

  r12 keeps the r11 face as it was — markup, palette, orbit, scope, grid. What
  changed is underneath: every sound the page used to build out of Web Audio
  nodes now lives in ONE AudioWorkletProcessor (WORKLET_SRC), and the page
  only sends it messages.

  ═══════════════════════════════════════════════════════════════════════════
  WHY r12 STOPPED BEING A WEAVE PAGE
  ═══════════════════════════════════════════════════════════════════════════
  r11 announced itself up the srcd-omni tier as a utility page:
      hello {cls:'weave', accent:'#39FFB4'} · ident {accent:'#39FFB4'} · weave-status
  The enclosure paints a weave page's accent into its name / scope colour and
  its status into a row of its own — racked as a module, that is the teal-green
  repaint and the extra row under the level rows. A module owns no enclosure
  colour and no enclosure row, so r12 sends NONE of them, only the srcd-duo
  module protocol below. Do not add an accent back.

  ═══════════════════════════════════════════════════════════════════════════
  CONCEPT
  ═══════════════════════════════════════════════════════════════════════════
  An expanded alien telephone keypad: a human DTMF pad layout (the 3×4 ITU
  frequency matrix, 12 tone buttons) extended with xenotype tone functions —
  8 toggle buttons spiraling outward around the dial pad, plus a vector-field
  radar scope for spatial audio control. The alien influence is a FLAVOR
  (exotic tunings, non-Western intervals, inhuman timing), not a foundation.

  Interaction model: BUTTON-MASHING AS COMPOSITION. Press, hold, drag,
  chord, and sequence buttons to deploy configured tones and patterns.
  Immediate and tactile, but deep enough to build musically applicable
  patterns and export them.

  ═══════════════════════════════════════════════════════════════════════════
  MODULE PROTOCOL (SRC-D r158 · srcd-duo only)
  ═══════════════════════════════════════════════════════════════════════════
    up    wl-mount {processor, source:WORKLET_SRC, opts, rates} · wl-send {m}
          wl-kill · pwr-state {on}                    (only ever through srcdUp)
    down  wl-ready {sr} · wl-fail {err} · wl-progress · wl-msg {m}
          tap-power · pwr-request · midi-note {note, vel, on} · bpm {bpm} · wl-dead · chrome-header {hide}
  Every message listener runs behind srcdAdmit (window + origin). Text from
  outside the page lands with textContent, never as markup.

  WORKLET PORT — arrays; the P index is the wire protocol, append only:
    ['p', i, v]               every sounding face control: LEVEL TUNING ENGINE
                              BEND SCOPE-X SCOPE-Y PHANTOM DRONE FRACTURE GRAVITY
                              STUTTER MIRROR · r14: AMOUNT ATTACK RELEASE, BPM GATE
                              SWING, the sixteen steps, ROW HZ COL HZ RATIO
    ['on', note, vel, how?]   how 0 live / MIDI · 1 a sequencer step · 2 clean DTMF
    ['off', note, how?]       ['bend', note, cents]  (gesture-zone drag)
    ['play', 1|0, atTime]     the transport — the rack's, or PLAY / SPACE here
    ['panic']                 echoed back so the face clears with it
    ['smp', op, slot, …]      sample slots: rec · get · load · start · stop · clr
  and back from it:
    ['run', 1|0] · ['st', step]          the loop runs / stopped · the step it is on
    ['sl', slot, state, seconds]         0 empty 1 ready 2 playing 3 recording
                                         4 armed for the downbeat 5 cued for it
    ['smp', 'buf', slot, data, rate]     a finished take, for the face to keep
    ['panic']
  NOTE MAP: C4–B4 (60–71) are the 12 keys  1 2 3 / 4 5 6 / 7 8 9 / * 0 # ;
  other octaves play the same key that many octaves away.

  ═══════════════════════════════════════════════════════════════════════════
  AUDIO
  ═══════════════════════════════════════════════════════════════════════════
  Hosted: the rack owns the AudioContext; this page NEVER builds one. ⏻ (or the
  first key / glyph / slot gesture, as r11 did) sends wl-mount; a refusal or a
  silence fails closed. Standalone: the same gesture builds our own context,
  loads WORKLET_SRC from a blob, node → destination.
  Signal order inside the worklet is r11's node graph, stage for stage:
    voices + drone + slots → LEVEL (the slot recorder taps here) → STUTTER gate
    → BEND chain → scope [lowpass dry + reverb wet → pan → phantom delay → gain]
    → limiter → ceil1
  Slot audio is owned by the face and re-sent on every power-up, so a power
  cycle or a rack restart does not lose recorded slots.

  ═══════════════════════════════════════════════════════════════════════════
  BUILD ORDER (phases)
  ═══════════════════════════════════════════════════════════════════════════
    r01 stub  → this file renders the shell, plays a proof-of-concept DTMF tone
    phase 1   → deep stub: full architecture scaffolded, working POC voice,
                protocol wired, all engines/FX/samples/patterns left as TODO
    phase 2   → implement alternate tone engines (FM, noise, wavetable, granular)
    phase 3   → circuit-bend FX chain (drive, glitch/bitcrush, full)
    phase 4   → sample handling: self-record from masterGain + pattern render to buffer
    phase 5   → data-row integration (event emission, source requests)
    phase 6   → pattern recorder (record/play/quantize)
    phase 7   → pattern serialize/export + XML sheet-music
    phase 8   → alien DTMF banks + custom tuning tables  ✓
    phase 9   → gesture zones (pitch-bend ✓), layout customization, STEP grid UI
    r12       → SRC-D r158 module: sound in usr-glitch-dial, srcd-duo only  ✓
    r13       → one screen on the phone (stylus keys, finger glyphs), multi-touch holds  ✓
    r14       → the sequence in the worklet (sample-tight, on the rack's bar), backwards
                PHANTOM, AMOUNT / ATTACK / RELEASE, denser reverb + drive, the CFG
                panel (phase 9's config), keys with their Hz, the step ring  ✓

  ═══════════════════════════════════════════════════════════════════════════
  FILENAME / ACTIVATION
  ═══════════════════════════════════════════════════════════════════════════
  glitch_dial.html, attached to the rack project; reopening ØMNI_FRΛMΞ ports
  it. It is a rack module now, not a utility page: if omni_frame.html still
  lists 'glitch_dial.html' in WEAVE_PAGES (the r11 activation step), take it
  out — one file cannot be both.

  ═══════════════════════════════════════════════════════════════════════════
  OPEN QUESTIONS
  ═══════════════════════════════════════════════════════════════════════════
  1. Live recording vs pre-rendered taps for sample buttons
  2. Xenotype aesthetic visibility in UI vs purely sonic
  3. Layout customization vs fixed layouts
  4. Mixer view necessity
  5. Cross-page audio routing (glitch dial output back into a chassis)
  ═══════════════════════════════════════════════════════════════════════════
-->

<style>
  /* ═══════════════════════════════════════════════════════════════════════
     PALETTE — alien-signal teal-green primary, circuit-bend magenta secondary.
     Deliberately distinct from data_weave's orange (#FF4E00) so the row
     changing is visible at a glance, exactly like DΛTΛ_WΞΛVΞ was deliberately
     not the racks' colour. */
  :root {
    --signal:   #39FFB4;   /* alien-signal teal-green, primary */
    --bend:     #FF3D8B;   /* circuit-bend magenta, secondary */
    --xeno:    #b026ff;   /* xenotype violet, modifier accent */
    --drone:   #ff2200;   /* deep-signal red, drone accent */
    --hud:     #00e5ff;   /* HUD cyan — drop-naut scope accent */
    --phantom: #b026ff;   /* phantom reverse-delay sweep */
    --obsidian: #050610;
    --panel-bg: #0a0c14;
    --border:   #1a2030;
    --muted:    #5a7090;
  }

  body {
    background: var(--obsidian);
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 78% 12%, rgba(0,229,255,0.3), transparent),
      radial-gradient(1px 1px at 45% 65%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1px 1px at 88% 78%, rgba(176,38,255,0.3), transparent),
      radial-gradient(1px 1px at 22% 88%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1px 1px at 62% 35%, rgba(0,229,255,0.2), transparent),
      radial-gradient(1px 1px at 8% 55%, rgba(255,255,255,0.15), transparent),
      radial-gradient(ellipse at 50% 0%, #0a1525 0%, transparent 70%),
      radial-gradient(ellipse at 25% 90%, rgba(176,38,255,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 75% 60%, rgba(0,229,255,0.04) 0%, transparent 45%),
      linear-gradient(180deg, #050610 0%, #0a0c18 50%, #050610 100%);
    background-attachment: fixed;
    color: var(--signal);
    font-family: 'Courier New', Courier, monospace;
    margin: 0; padding: 1.5rem;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    overflow-x: hidden;
  }

  .terminal-container {
    width: 100%; max-width: 760px;
    background: var(--panel-bg);
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(0,229,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(176,38,255,0.03) 0%, transparent 50%);
    border: 1px solid var(--border);
    box-shadow: 0 0 40px rgba(0,229,255,0.08), 0 0 80px rgba(176,38,255,0.05), inset 0 0 20px rgba(0,0,0,0.8);
    padding: 22px; border-radius: 8px;
    position: relative; isolation: isolate;   /* the galaxy sits behind the face, above this panel's own ground */
    box-sizing: border-box;
  }
  .terminal-container::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--hud), transparent);
    opacity: 0.5;
  }

  /* hosted inside ØMNI, the enclosure draws the header rows; hide ours so it
     is not drawn twice. Standalone this class never arrives. Mirrors
     data_weave's body.omni-chromed pattern. */
  body.omni-chromed h2 { display: none; }

  h2 {
    border-bottom: 2px solid var(--hud);
    padding-bottom: 10px; margin: 0;
    text-transform: uppercase; letter-spacing: 2px;
    text-shadow: 0 0 6px rgba(0,229,255,0.4);
    display: flex; justify-content: space-between; align-items: center;
  }
  h2 .build-tag { color: var(--muted); font-size: 0.6em; letter-spacing: 1px; }

  /* STATUS BAR — indicator + text + PANIC. Mirrors data_weave's status-bar
     but with the signal palette. PANIC stops all voices immediately. */
  .status-bar {
    background: linear-gradient(180deg, #061218 0%, #050a10 100%);
    padding: 10px 14px;
    border: 1px solid var(--hud); margin: 14px 0; border-radius: 6px;
    display: flex; align-items: center; justify-content: space-between;
    font-weight: bold; box-shadow: inset 0 0 12px rgba(0,0,0,0.5), 0 0 10px rgba(0,229,255,0.08);
  }
  .status-left { display: flex; align-items: center; gap: 14px; }
  .status-indicator {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--signal); box-shadow: 0 0 10px var(--signal);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { opacity: 1; box-shadow: 0 0 12px var(--signal); }
    50%  { opacity: 0.3; box-shadow: 0 0 3px var(--signal); }
    100% { opacity: 1; box-shadow: 0 0 12px var(--signal); }
  }

  .btn {
    background: transparent; color: var(--bend);
    border: 1px solid var(--bend); padding: 4px 12px; border-radius: 4px;
    font-family: inherit; cursor: pointer; text-transform: uppercase;
    transition: all 0.15s;
    box-shadow: 0 0 4px rgba(255,61,139,0.2);
  }
  .btn:hover { background: var(--bend); color: var(--obsidian); box-shadow: 0 0 14px var(--bend); }
  .btn:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
  .btn:disabled:hover { background: transparent; color: var(--bend); box-shadow: none; }
  /* ⏻ POWER (r12 · SRC-D r158 face) — the same .btn as PANIC beside it, lit
     in the scope's HUD cyan while the engine is live. */
  .status-right { display: flex; align-items: stretch; gap: 8px; }
  #pwr { line-height: 1; }
  /* ⏻ is drawn, not typed: U+23FB is missing from many phone fonts and showed as an empty box (tofu) */
  #pwr .pwr-ic { display: block; margin: 0 auto; }
  #pwr.on { color: var(--hud); border-color: var(--hud); box-shadow: 0 0 10px rgba(0,229,255,0.35); }
  #pwr.on:hover { background: var(--hud); color: var(--obsidian); box-shadow: 0 0 14px var(--hud); }

  /* GLOBAL CONTROLS — TUNING / MODE / BEND selectors. Stub wiring only;
     real behaviour TODO in phases 2–8. */
  .controls {
    display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
  }
  .controls select {
    background: var(--obsidian); color: var(--signal);
    border: 1px solid var(--border); padding: 5px 8px; border-radius: 4px;
    font-family: inherit; cursor: pointer;
    transition: all 0.15s;
  }
  .controls select:hover {
    border-color: var(--signal);
    box-shadow: 0 0 8px rgba(57,255,180,0.2);
  }
  .controls select:focus {
    border-color: var(--signal);
    box-shadow: 0 0 12px rgba(57,255,180,0.3);
    outline: none;
  }
  .controls label { color: var(--muted); font-size: 0.8em; letter-spacing: 1px; }

  /* 3×4 DTMF MACRO GRID — the heart of the interface. One button per
     row×col intersection. Compact for stylus precision. Neon-glowing,
     pulsing, dynamic — each button is a living signal. */
  #grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    position: relative; z-index: 3;
    width: 150px;
  }
  .macro {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, #0d1815 0%, #080c0a 100%);
    border: 1px solid rgba(57,255,180,0.2);
    border-radius: 6px;
    color: var(--signal); cursor: pointer; user-select: none; touch-action: none;
    font-weight: bold; letter-spacing: 1px; font-size: 0.75em;
    transition: all 0.12s ease;
    box-shadow: inset 0 0 6px rgba(57,255,180,0.05), 0 0 3px rgba(57,255,180,0.1);
    animation: macro-idle 3s ease-in-out infinite;
  }
  @keyframes macro-idle {
    0%, 100% { box-shadow: inset 0 0 8px rgba(57,255,180,0.05), 0 0 4px rgba(57,255,180,0.08); }
    50% { box-shadow: inset 0 0 12px rgba(57,255,180,0.1), 0 0 8px rgba(57,255,180,0.15); }
  }
  .macro:hover {
    border-color: var(--signal);
    box-shadow: 0 0 16px rgba(57,255,180,0.4), inset 0 0 12px rgba(57,255,180,0.15);
    transform: translateY(-1px);
  }
  .macro.down {
    background: radial-gradient(circle, var(--signal) 0%, #1aff8a 60%, #00cc77 100%);
    color: var(--obsidian);
    box-shadow: 0 0 24px var(--signal), 0 0 40px rgba(57,255,180,0.4), inset 0 0 8px rgba(0,0,0,0.2);
    transform: scale(0.95);
    animation: macro-down 0.3s ease;
  }
  @keyframes macro-down {
    0% { box-shadow: 0 0 4px var(--signal); }
    100% { box-shadow: 0 0 24px var(--signal), 0 0 40px rgba(57,255,180,0.4); }
  }

  /* ═ ΛLIΞN MØDΞ — when ALIEN-01 tuning is active, the whole grid shifts
     palette so you can see you left the human ITU table. The border and
     background tint go violet; the signal teal stays on the number buttons. */
  body.alien-mode .terminal-container { box-shadow: 0 0 30px rgba(176,38,255,0.15), inset 0 0 15px rgba(0,0,0,0.8); }
  body.alien-mode #grid { border: 1px solid rgba(176,38,255,0.2); padding: 4px; border-radius: 8px; }
  body.alien-mode .macro {
    border-color: rgba(176,38,255,0.25);
    color: var(--xeno);
    box-shadow: inset 0 0 8px rgba(176,38,255,0.08), 0 0 6px rgba(176,38,255,0.1);
  }
  body.alien-mode .macro.down {
    background: radial-gradient(circle, var(--xeno) 0%, #c44fff 60%, #8a1acc 100%);
    box-shadow: 0 0 24px var(--xeno), 0 0 40px rgba(176,38,255,0.4);
  }

  /* ═ CLOΛK MØDΞ — stealth mode: audio keeps playing but the .down
     visual state goes invisible so nobody watching the screen can see what
     you're dialing. The buttons still respond to touch; the feedback is just
     suppressed. A faint violet ring stays so the operator knows it's on. */
  body.phantom-mode .macro.down {
    background: #0d1815; color: rgba(57,255,180,0.3); box-shadow: none; transform: none;
    border: 1px solid rgba(176,38,255,0.12);
    animation: none;
  }

  /* ═ SPECTRUM MØDΞ — recolors each button based on its row frequency.
     Lower rows = warm (red/orange), higher rows = cool (blue/cyan). Applied
     as a per-button neon inner glow. Toggles on/off. */
  .macro.spectrum-0 { box-shadow: inset 0 0 16px rgba(255,60,0,0.35), 0 0 10px rgba(255,60,0,0.2); border-color: rgba(255,60,0,0.3); }
  .macro.spectrum-1 { box-shadow: inset 0 0 16px rgba(255,180,0,0.3), 0 0 10px rgba(255,180,0,0.2); border-color: rgba(255,180,0,0.3); }
  .macro.spectrum-2 { box-shadow: inset 0 0 16px rgba(0,200,255,0.3), 0 0 10px rgba(0,200,255,0.2); border-color: rgba(0,200,255,0.3); }
  .macro.spectrum-3 { box-shadow: inset 0 0 16px rgba(80,120,255,0.3), 0 0 10px rgba(80,120,255,0.2); border-color: rgba(80,120,255,0.3); }

  /* ═ CØCKPIT — the main interface area: radar scope + dial cluster side
     by side. The radar is a vector field controller; the dial cluster has
     the 4×4 grid at center and 8 xenotype buttons spiraling outward. */
  .cockpit {
    display: flex; gap: 16px; margin-bottom: 16px;
    justify-content: center; align-items: center; flex-wrap: wrap;
  }

  /* ═ DRØP-NΛUT SCØPΞ — a circular vector-field HUD display. Draggable
     vector points set X (distance: reverb, pitch, pan) and Y (cutoff, amp).
     A rotating sweep line pings points as it passes them. In PHANTOM mode
     a violet counter-clockwise beam engages, driving reverse-delay. */
  .radar-wrap {
    position: relative; width: 200px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .radar {
    width: 200px; height: 200px; background: radial-gradient(circle, #061218 0%, #030608 70%);
    border: 2px solid var(--hud); border-radius: 50%;
    box-shadow: 0 0 30px rgba(0,229,255,0.25), inset 0 0 40px rgba(0,0,0,0.85);
    cursor: crosshair; user-select: none; touch-action: none;
    animation: radar-glow 3s ease-in-out infinite;
  }
  @keyframes radar-glow {
    0%, 100% { box-shadow: 0 0 30px rgba(0,229,255,0.25), inset 0 0 40px rgba(0,0,0,0.85); }
    50% { box-shadow: 0 0 45px rgba(0,229,255,0.4), inset 0 0 40px rgba(0,0,0,0.85); }
  }
  .radar-grid { fill: none; stroke: rgba(0,229,255,0.12); stroke-width: 0.5; }
  .radar-cross { stroke: rgba(0,229,255,0.15); stroke-width: 0.5; stroke-dasharray: 3,3; }
  /* HUD corner brackets — angular frame elements outside the circle */
  .radar-bracket {
    stroke: var(--hud); stroke-width: 1.5; fill: none; opacity: 0.4;
  }
  /* normal clockwise sweep */
  .radar-sweep {
    stroke: var(--hud); stroke-width: 1; stroke-linecap: round;
    opacity: 0.55;
    transform-origin: 100px 100px;
    animation: radar-sweep 4s linear infinite;
  }
  @keyframes radar-sweep {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .radar-sweep-fan {
    fill: url(#sweep-grad);
    transform-origin: 100px 100px;
    animation: radar-sweep 4s linear infinite;
    pointer-events: none;
  }
  /* phantom counter-clockwise sweep — violet, reverse rotation */
  .radar-sweep-phantom {
    stroke: var(--phantom); stroke-width: 1.5; stroke-linecap: round;
    opacity: 0; transform-origin: 100px 100px;
    animation: radar-sweep-rev 4s linear infinite;
    filter: drop-shadow(0 0 4px var(--phantom));
    transition: opacity 0.3s;
  }
  .radar-sweep-phantom-fan {
    fill: url(#sweep-grad-phantom);
    transform-origin: 100px 100px;
    animation: radar-sweep-rev 4s linear infinite;
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  @keyframes radar-sweep-rev {
    0%   { transform: rotate(360deg); }
    100% { transform: rotate(0deg); }
  }
  /* when phantom mode is active: show phantom sweep, dim normal sweep */
  .radar.phantom-sweep .radar-sweep-phantom { opacity: 0.65; }
  .radar.phantom-sweep .radar-sweep-phantom-fan { opacity: 0.4; }
  .radar.phantom-sweep .radar-sweep { opacity: 0.12; }
  .radar.phantom-sweep .radar-sweep-fan { opacity: 0.12; }
  /* phantom mode border tint */
  .radar.phantom-sweep {
    border-color: var(--phantom);
    box-shadow: 0 0 35px rgba(176,38,255,0.35), inset 0 0 40px rgba(0,0,0,0.85);
    animation: radar-phantom-glow 3s ease-in-out infinite;
  }
  @keyframes radar-phantom-glow {
    0%, 100% { box-shadow: 0 0 35px rgba(176,38,255,0.35), inset 0 0 40px rgba(0,0,0,0.85); }
    50% { box-shadow: 0 0 50px rgba(176,38,255,0.5), inset 0 0 40px rgba(0,0,0,0.85); }
  }
  .radar-pt {
    fill: var(--bend); stroke: #fff; stroke-width: 1;
    cursor: grab; filter: drop-shadow(0 0 6px var(--bend));
    transition: r 0.1s;
  }
  .radar-pt.active {
    fill: var(--hud);
    filter: drop-shadow(0 0 10px var(--hud));
    animation: radar-pt-pulse 1.5s ease-in-out infinite;
  }
  @keyframes radar-pt-pulse {
    0%, 100% { filter: drop-shadow(0 0 8px var(--hud)); }
    50% { filter: drop-shadow(0 0 14px var(--hud)); }
  }
  .radar-pt.dragging { cursor: grabbing; }
  .radar-pt-label {
    fill: var(--muted); font-size: 7px; font-family: 'Courier New', monospace;
    text-anchor: middle; pointer-events: none;
  }
  /* axis labels integrated INSIDE the SVG so they never collide with chrome */
  .radar-axis-label {
    fill: rgba(0,229,255,0.5); font-size: 5.5px; font-family: 'Courier New', monospace;
    letter-spacing: 0.5px; pointer-events: none;
  }
  .radar-readout {
    font-size: 0.6em; color: var(--muted); letter-spacing: 1px;
    text-align: center; min-height: 14px;
  }
  .radar-readout .val { color: var(--hud); }

  /* ═ DIΛL CLUSTΞR — the 3×4 grid at center with 8 xenotype buttons
     orbiting outward around it. Extra top padding ensures the orbit
     doesn't collide with the radar scope or its readout text above. */
  .dial-cluster {
    position: relative; padding: 72px 64px 110px 64px;
    margin-top: 12px;
  }
  .dial-cluster::before {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 130%; height: 130%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(0,229,255,0.05) 0%, rgba(176,38,255,0.03) 40%, transparent 70%);
    pointer-events: none; z-index: 0;
    animation: cluster-breathe 4s ease-in-out infinite;
  }
  @keyframes cluster-breathe {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }
  .xo-spiral {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 3;
  }
  .xo-spiral .xo-btn {
    position: absolute; left: 0; top: 0;
    pointer-events: auto;
    width: 34px; height: 34px;
    /* transform is set by JS orbit loop — translate(x,y) + centering */
    border-radius: 50%;
    font-size: 0.9em;
    z-index: 4;
    background: radial-gradient(circle, #110a1a 0%, #06040a 100%);
    box-shadow: 0 0 6px rgba(176,38,255,0.2), inset 0 0 4px rgba(176,38,255,0.1);
    animation: xo-glow 4s ease-in-out infinite;
    will-change: transform;
    touch-action: none;
  }
  .xo-spiral .xo-btn:nth-child(2n) { animation-delay: -1s; }
  .xo-spiral .xo-btn:nth-child(3n) { animation-delay: -2s; }
  .xo-spiral .xo-btn:nth-child(4n) { animation-delay: -3s; }
  @keyframes xo-glow {
    0%, 100% { box-shadow: 0 0 6px rgba(176,38,255,0.2), inset 0 0 4px rgba(176,38,255,0.1); }
    50% { box-shadow: 0 0 12px rgba(176,38,255,0.35), inset 0 0 8px rgba(176,38,255,0.2); }
  }
  /* GRABBED state — glyph is held by the operator, frozen in orbit */
  .xo-spiral .xo-btn.grabbed {
    width: 42px; height: 42px;
    z-index: 10;
    box-shadow: 0 0 20px var(--hud), 0 0 40px rgba(0,229,255,0.3), inset 0 0 8px rgba(0,229,255,0.2);
    border-color: var(--hud); color: var(--hud);
    filter: brightness(1.4);
  }
  /* connector lines from grid center to each spiral button (SVG overlay) */
  .xo-spiral-lines {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }

  /* ═ XΞNØTYPE SPIRΛL BUTTØNS — 8 toggle switches arranged in a spiral
     around the central DTMF grid. Each changes the pad's behaviour. */
  .xo-btn {
    background: radial-gradient(circle, #110a1a 0%, #06040a 100%);
    border: 1px solid var(--border); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .xo-spiral .xo-btn:hover {
    border-color: var(--xeno); color: var(--xeno);
    box-shadow: 0 0 14px rgba(176,38,255,0.4), inset 0 0 6px rgba(176,38,255,0.15);
    filter: brightness(1.2);
  }
  .xo-btn.active {
    border-color: var(--xeno); color: var(--xeno);
    box-shadow: 0 0 16px rgba(176,38,255,0.5), inset 0 0 8px rgba(176,38,255,0.2);
    background: radial-gradient(circle, rgba(176,38,255,0.15) 0%, rgba(176,38,255,0.05) 100%);
    animation: xo-active-pulse 1.5s ease-in-out infinite;
  }
  @keyframes xo-active-pulse {
    0%, 100% { box-shadow: 0 0 16px rgba(176,38,255,0.5), inset 0 0 8px rgba(176,38,255,0.2); }
    50% { box-shadow: 0 0 24px rgba(176,38,255,0.7), inset 0 0 12px rgba(176,38,255,0.3); }
  }
  .xo-btn[data-xo="drone"].active {
    border-color: var(--drone); color: var(--drone);
    box-shadow: 0 0 10px rgba(255,34,0,0.4); background: rgba(255,34,0,0.08);
  }
  .xo-btn[data-xo="pulse"].active {
    border-color: var(--bend); color: var(--bend);
    box-shadow: 0 0 10px rgba(255,61,139,0.4); background: rgba(255,61,139,0.08);
  }
  .xo-btn[data-xo="fracture"].active {
    border-color: #00d4ff; color: #00d4ff;
    box-shadow: 0 0 10px rgba(0,212,255,0.4); background: rgba(0,212,255,0.08);
  }
  .xo-btn[data-xo="gravity"].active {
    border-color: #ff8800; color: #ff8800;
    box-shadow: 0 0 10px rgba(255,136,0,0.4); background: rgba(255,136,0,0.08);
  }
  .xo-btn[data-xo="stutter"].active {
    border-color: #ff00aa; color: #ff00aa;
    box-shadow: 0 0 10px rgba(255,0,170,0.4); background: rgba(255,0,170,0.08);
    animation: xo-flicker 0.12s infinite alternate;
  }
  .xo-btn[data-xo="mirror"].active {
    border-color: #88ff00; color: #88ff00;
    box-shadow: 0 0 10px rgba(136,255,0,0.4); background: rgba(136,255,0,0.08);
  }
  @keyframes xo-flicker {
    0% { opacity: 1; } 100% { opacity: 0.55; }
  }

  /* ═ FRACTURE MØDΞ — held buttons get a cracked, split-glow effect.
     Multiple offset neon box-shadows give a "shattered" look. */
  body.fracture-mode .macro.down {
    box-shadow: 0 0 24px var(--signal), 4px 0 12px rgba(0,212,255,0.4), -4px 0 12px rgba(176,38,255,0.35), inset 0 0 8px rgba(0,0,0,0.2);
    border-color: #00d4ff;
    animation: fracture-pulse 0.4s ease-in-out infinite alternate;
  }
  @keyframes fracture-pulse {
    0% { box-shadow: 0 0 24px var(--signal), 4px 0 12px rgba(0,212,255,0.4), -4px 0 12px rgba(176,38,255,0.35); }
    100% { box-shadow: 0 0 28px var(--signal), 6px 0 16px rgba(0,212,255,0.5), -6px 0 16px rgba(176,38,255,0.45); }
  }

  /* ═ GRAVITY MØDΞ — held buttons sink visually with a warm downward
     neon gradient. */
  body.gravity-mode .macro.down {
    background: linear-gradient(180deg, var(--signal) 0%, #ff8800 70%, #aa4400 100%);
    box-shadow: 0 0 24px #ff8800, 0 0 40px rgba(255,136,0,0.3);
    border-color: #ff8800;
    animation: gravity-sink 3s ease-in-out forwards;
  }
  @keyframes gravity-sink {
    0% { box-shadow: 0 0 24px var(--signal); }
    100% { box-shadow: 0 0 24px #ff8800, 0 0 40px rgba(255,136,0,0.3); }
  }

  /* ═ STUTTER MØDΞ — held buttons flicker on/off with neon strobe. */
  body.stutter-mode .macro.down {
    animation: stutter-flicker 0.08s infinite steps(2, end);
  }
  @keyframes stutter-flicker {
    0% { box-shadow: 0 0 24px var(--signal), 0 0 40px rgba(57,255,180,0.4); background: var(--signal); }
    50% { box-shadow: 0 0 2px rgba(57,255,180,0.1); background: #0d1815; color: rgba(57,255,180,0.3); }
  }

  /* ═ MIRROR MØDΞ — the grid border shifts to acid green and the
     container gets a subtle scaleX hint that the matrix is transposed. */
  body.mirror-mode #grid { border: 1px solid rgba(136,255,0,0.2); padding: 4px; border-radius: 8px; }
  body.mirror-mode .macro { border-color: rgba(136,255,0,0.2); }

  /* 8 SAMPLE-HANDLING SLOTS — source material buttons. Short-press plays/
     stops a loaded sample; long-press (500ms) records 2s from masterGain or
     renders a loaded PATTERN into the slot; double-click clears. */
  #sample-row {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-bottom: 14px;
  }

  /* 16-STEP SEQUENCER — visible only in STEP mode. Thin row of cells below
     the macro grid. Active steps are filled, the edit cursor is highlighted,
     and the playhead cell lights up during playback. */
  #step-row {
    display: none; grid-template-columns: repeat(16, 1fr); gap: 3px;
    margin-bottom: 14px;
  }
  .step-cell {
    height: 26px; background: #0c0c10; border: 1px solid var(--border); border-radius: 3px;
    color: var(--muted); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 0.55em; transition: all 0.08s; user-select: none;
  }
  .step-cell:hover { border-color: var(--signal); box-shadow: 0 0 6px rgba(57,255,180,0.2); }
  .step-cell.active { background: var(--signal); color: var(--obsidian); border-color: var(--signal); box-shadow: 0 0 8px var(--signal); }
  .step-cell.cursor { border-color: var(--bend); box-shadow: 0 0 8px var(--bend); }
  .step-cell.playhead { background: var(--bend); color: var(--obsidian); box-shadow: 0 0 12px var(--bend); animation: step-pulse 0.15s ease; }
  @keyframes step-pulse { 0% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .slot {
    aspect-ratio: 1; background: #0c0c10; border: 1px dashed var(--border); border-radius: 4px;
    color: var(--muted); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 0.75em; transition: all 0.1s; user-select: none;
  }
  .slot:hover { border-color: var(--bend); color: var(--bend); box-shadow: 0 0 8px rgba(255,61,139,0.2); }
  .slot.loaded { border-style: solid; border-color: var(--bend); color: var(--bend); box-shadow: 0 0 6px rgba(255,61,139,0.15); }
  .slot.playing { background: var(--bend); color: var(--obsidian); box-shadow: 0 0 14px var(--bend); }
  .slot.recording { background: var(--bend); color: var(--obsidian); animation: pulse 0.8s infinite; box-shadow: 0 0 14px var(--bend); }
  /* r14 · waiting for the loop's downbeat: ARMED to record (still dashed), CUED to play */
  .slot.armed { border-color: var(--bend); color: var(--bend); animation: slot-wait 0.8s steps(2, end) infinite; }
  .slot.cued { border-style: solid; border-color: var(--bend); color: var(--bend); animation: slot-wait 0.8s steps(2, end) infinite; }
  @keyframes slot-wait { 50% { opacity: 0.4; } }

  /* CONFIG PANEL — r14 fills r11's placeholder: the controls that shape the
     sound and the sequence (LEVEL, ATTACK, RELEASE, AMOUNT · BPM, GATE, SWING ·
     the CUSTOM bank), opened by CFG beside ⏻. Below the slots, where r11 put it;
     on the phone it lies over the selectors and the scope, so the keys stay
     playable while it is open and nothing scrolls. */
  .config-panel {
    border: 1px solid var(--border); padding: 12px; color: var(--muted);
    font-size: 0.85em; display: none;
  }
  .config-panel.open {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px 12px;
    margin-top: 14px; border-radius: 6px;
    background: linear-gradient(180deg, #061218 0%, #050a10 100%);
    box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
  }
  .cfg-fd {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 6px;
    font-size: 0.8em; letter-spacing: 1px; min-width: 0;
  }
  .cfg-fd output { color: var(--hud); white-space: nowrap; }
  .cfg-fd input[type=range] { grid-column: 1 / -1; width: 100%; min-width: 0; margin: 0; accent-color: var(--signal); }
  .cfg-btns { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .cfg-btns .btn { font-size: 0.85em; }
  /* ═ LEN · GALAXY ═ the sequence length slider, and the spiral galaxy behind the face that its slide zooms:
     out to the whole galaxy at 16 steps, in toward the core at 1. The galaxy is one painted layer, scaled by
     transform only while the slider moves — nothing runs when it is still. */
  .galaxy { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; overflow: hidden; border-radius: inherit; pointer-events: none; opacity: 0.5; }
  .galaxy-zoom { position: absolute; left: 50%; top: 50%; width: 1024px; height: 1024px; margin: -512px 0 0 -512px; transform-origin: 50% 50%; will-change: transform; }
  #galaxy-img { display: block; width: 100%; height: 100%; }
  .seq-len { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
  .seq-len label { color: var(--muted); font-size: 0.8em; letter-spacing: 1px; }
  .seq-len output { min-width: 2ch; text-align: right; color: var(--hud); font-size: 0.85em; text-shadow: 0 0 6px rgba(0,229,255,0.5); }
  #len { flex: 1; min-width: 0; height: 26px; margin: 0; padding: 0; background: transparent; cursor: pointer; touch-action: none;
         -webkit-appearance: none; appearance: none; }
  #len:focus { outline: none; }
  #len::-webkit-slider-runnable-track { height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(0,229,255,0.12), var(--hud)); box-shadow: 0 0 8px rgba(0,229,255,0.45); }
  #len::-moz-range-track { height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(0,229,255,0.12), var(--hud)); box-shadow: 0 0 8px rgba(0,229,255,0.45); }
  #len::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -7px; border-radius: 50%; box-sizing: border-box;
         background: var(--obsidian); border: 2px solid var(--hud); box-shadow: 0 0 10px var(--hud), inset 0 0 5px rgba(0,229,255,0.55); }
  #len::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box;
         background: var(--obsidian); border: 2px solid var(--hud); box-shadow: 0 0 10px var(--hud), inset 0 0 5px rgba(0,229,255,0.55); }
  #len:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 14px var(--signal), inset 0 0 5px rgba(57,255,180,0.6); border-color: var(--signal); }
  #cfg.on, #play.on { background: var(--bend); color: var(--obsidian); box-shadow: 0 0 14px var(--bend); }

  /* ═ r14 · KEYS · RING · READOUT ═ each key carries its two tones under its
     label (MIRROR shows them swapped); a key the sequence or the rack's MIDI
     is playing lights in the scope's cyan — PHANTOM hides that, as it hides a
     press. The scope's rim carries the sixteen steps (see the ring in §10). */
  .macro { flex-direction: column; gap: 1px; }
  .macro .lab { line-height: 1; }
  .macro .hz { font-size: 6.5px; font-weight: normal; letter-spacing: 0; line-height: 1; opacity: 0.6; white-space: nowrap; }
  body:not(.phantom-mode) .macro.seq:not(.down),
  body:not(.phantom-mode) .macro.midi:not(.down) {
    border-color: var(--hud); color: var(--hud);
    box-shadow: 0 0 14px rgba(0,229,255,0.5), inset 0 0 10px rgba(0,229,255,0.2);
    animation: none;
  }
  .ring-tick { stroke: rgba(0,229,255,0.22); stroke-width: 1; stroke-linecap: round; pointer-events: none; }
  .ring-tick.beat { stroke: rgba(0,229,255,0.45); }
  .ring-tick.hit { stroke: var(--signal); stroke-width: 2; }
  .ring-tick.ph { stroke: var(--bend); stroke-width: 2.5; }
  .radar.phantom-sweep .ring-tick:not(.hit):not(.ph) { stroke: rgba(176,38,255,0.35); }
  .ring-cursor { fill: var(--bend); pointer-events: none; }
  .ring-tick.off { opacity: 0.22; }          /* a step the loop does not reach (LEN) */
  .step-cell.out { opacity: 0.3; }
  .radar-ping { fill: none; stroke: var(--hud); stroke-width: 1; pointer-events: none; }
  .radar.phantom-sweep .radar-ping { stroke: var(--phantom); }
  .radar-readout { width: max-content; }   /* centred under the scope, as wide as its longest line */
  .radar-readout .ro-l { display: block; white-space: nowrap; }
  .radar-readout .ro-sep { display: none; }
  .radar-readout .val { white-space: pre; }

  /* ═ MØBILΞ (r13) — Moto G Stylus portrait: the whole face on one screen,
     no scrolling. Same stack as r11 (radar on top, dial cluster below,
     controls in a compact grid, PLAY and EXPORT on their own row), sized for
     a STYLUS ON THE KEYS and FINGERS ON THE GLYPHS:
       · the keys may shrink to 36 px — a stylus tip is precise
       · the eight glyphs never shrink: 46 px, a fingertip, to catch and hold
       · fitPhone() (script §12) sets --key and --radar to the screen it finds:
         keys give way first down to 40 px, then the scope, then keys to 36
     The orbit flattens to stay inside the dial cluster, so nothing below or
     above it gets covered; where its ellipse crosses the keypad's corners the
     glyphs pass BEHIND the keys, so a stylus always lands on a key. */
  :root { --radar: 160px; --key: 44px; --glyph: 46px; }
  @media (max-width: 480px) {
    body { padding: 3px; min-height: 0; }

    .terminal-container { padding: 6px 9px 8px; border-radius: 6px; }

    h2 { font-size: 0.95em; padding-bottom: 5px; }
    h2 .build-tag { font-size: 0.55em; }

    .status-bar { padding: 3px 7px; margin: 5px 0; font-size: 0.8em; }
    .status-left { gap: 9px; min-width: 0; flex: 1 1 auto; }
    .status-indicator { width: 10px; height: 10px; flex: none; }
    /* the status line keeps the bar one height: two lines at most, then … */
    #status { font-size: 0.9em; line-height: 1.2; overflow: hidden; overflow-wrap: anywhere;
              display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
    .status-right { gap: 6px; flex: none; margin-left: 8px; }
    .status-bar .btn { min-height: 28px; padding: 3px 10px; }

    .controls {
      gap: 3px 6px; margin-bottom: 5px;
      display: grid;
      grid-template-columns: auto 1fr auto 1fr;
      align-items: center;
    }
    .controls label { font-size: 0.62em; }
    .controls select { padding: 3px 5px; font-size: 0.72em; }
    .controls .btn { padding: 3px 8px; font-size: 0.72em; }
    /* PLAY and EXPORT go full-width on their own row */
    .controls .btn { grid-column: span 2; }

    .cockpit { flex-direction: column; gap: 2px; margin-bottom: 5px; }

    .radar-wrap { width: var(--radar); gap: 1px; }
    .radar { width: var(--radar); height: var(--radar); }
    .radar-readout { min-height: 12px; line-height: 12px; white-space: nowrap; }   /* one line at any scope size */
    /* r14: the fuller readout stays one line, centred under the scope and as wide as it needs */
    .radar-readout { font-size: 0.55em; letter-spacing: 0; }
    .radar-readout .ro-l, .radar-readout .ro-sep { display: inline; }

    /* the keypad at --key a key; the cluster's height is exactly what the
       flattened orbit needs (outer glyph radius + its half) and no more */
    #grid { width: calc(3 * var(--key) + 8px); }
    .dial-cluster { padding: calc(0.28 * var(--key) + 1.07 * var(--glyph) + 8px) 40px; margin-top: 0; }
    .xo-spiral { z-index: 2; }
    .xo-spiral .xo-btn { box-sizing: border-box; width: var(--glyph); height: var(--glyph); font-size: 1.15em; }
    .xo-spiral .xo-btn.grabbed { width: calc(var(--glyph) + 8px); height: calc(var(--glyph) + 8px); }

    #sample-row { gap: 4px; margin-bottom: 0; }
    .slot { aspect-ratio: auto; height: 30px; touch-action: none; }
    #step-row { margin-bottom: 5px; }
    .step-cell { height: 20px; font-size: 0.5em; }
    .seq-len { margin-bottom: 2px; gap: 8px; }
    .seq-len label { font-size: 0.62em; }
    #len { height: 22px; }

    /* r14: CFG lies over the selectors and the scope (placeConfig() sizes it) */
    .config-panel.open {
      position: absolute; left: 9px; right: 9px; z-index: 20; margin: 0;
      grid-template-columns: 1fr 1fr; gap: 1px 12px; padding: 5px 9px;
      align-content: space-evenly; overflow-y: auto; box-sizing: border-box;
      background: var(--panel-bg); border-color: var(--hud);
      box-shadow: 0 0 24px rgba(0,0,0,0.9), inset 0 0 12px rgba(0,0,0,0.5);
    }
    .cfg-fd { font-size: 0.72em; gap: 0 6px; }
    .cfg-fd input[type=range] { height: 20px; }
    .cfg-btns .btn { min-height: 26px; padding: 2px 12px; }
  }
</style>
</head>
<body>
<div class="terminal-container">
  <!-- the backdrop LEN moves: a spiral galaxy, painted once by JS -->
  <div class="galaxy" aria-hidden="true"><div class="galaxy-zoom" id="galaxy-zoom"><canvas id="galaxy-img"></canvas></div></div>
  <h2>GLØTCH_DIΛL <span class="build-tag">r14 · drop-naut</span></h2>

  <div class="status-bar">
    <div class="status-left">
      <span class="status-indicator" id="dot"></span>
      <span id="status">STANDBY</span>
    </div>
    <div class="status-right">
      <button class="btn" id="cfg" aria-pressed="false" aria-controls="config" title="CONFIG · level, envelope, amount, tempo, the custom bank">CFG</button>
      <button class="btn" id="pwr" aria-pressed="false" title="POWER" aria-label="power"><svg class="pwr-ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3.6v7.4"/><path d="M6.9 7.3a7.5 7.5 0 1 0 10.2 0"/></svg></button>
      <button class="btn" id="panic">PANIC</button>
    </div>
  </div>

  <div class="controls">
    <label>TUNING</label>
    <select id="tuning">
      <option value="itu">ITU-DTMF</option>
      <option value="alien-01">ALIEN-01</option>
      <option value="custom">CUSTOM</option>
    </select>
    <label>MODE</label>
    <select id="mode">
      <option value="live">LIVE</option>
      <option value="pattern">PATTERN</option>

        for(let k=0;k<NS;k++){
          const rb=this.rBuf[k]; if(!rb||this.rArm[k]) continue;
          const q=this.rPos[k];
          if(q<this.rLen[k]){ rb[q]=x0; this.rPos[k]=q+1; }
          if(q+1>=this.rLen[k]) this.recEnd(k);
        }
      }
      /* ═ STUTTER: r11 closed the gate for 40 ms + 10 ms per held key on an 80 ms clock. Past
         80 ms the old timeline overlapped itself (a short gap, not a long one) and at exactly
         four keys it never reopened — that one case now leaves a 10 ms window ═ */
      let xf=x0;
      if(stuOn){
        if(this.stPos===0){
          const rr=40+(held*10<80?held*10:80), c=rr<80?rr:(rr>80?rr-80:70);
          this.stOff=Math.round(c*0.001*sr);
        }
        if(this.stPos<this.stOff) xf=0;
        if(++this.stPos>=this.stLen) this.stPos=0;
      }else this.stPos=0;
      /* ═ BEND ═ */
      if(bend!==0){
        if(bD){
          /* DRIVE: tanh with first-order antiderivative anti-aliasing (the alternate's) */
          const uu=dk*xf, au=uu<0?-uu:uu;
          const F=(au+Math.log1p(Math.exp(-2*au))-0.6931471805599453)*dKT;
          const dd=xf-this.dx1;
          const yd=(dd>1e-7||dd<-1e-7)?(F-this.dF1)/dd:Math.tanh(dk*0.5*(xf+this.dx1))/dT;
          this.dx1=xf; this.dF1=F; xf=yd;
        }
        if(bC){
          /* GLITCH then CRUSH: AMOUNT 0.5 is r11's 4 bits held 12 samples */
          xf=Math.round(xf*qz)/qz;
          if(--this.shC<=0){ this.shC=shN; this.shV=xf; }
          xf=this.shV;
        }else if(bE){
          /* ECHO: 250 ms, all wet as r11 wired it; AMOUNT sets the feedback (0.4 at 0.5) */
          const eb=this.eBuf, w=this.eW, yv=eb[w];
          let wv=xf+efb*yv; if(wv<1e-15&&wv>-1e-15) wv=0;
          eb[w]=wv; this.eW=w+1<this.eLen?w+1:0;
          const aw=wv<0?-wv:wv; if(aw>ePk) ePk=aw;
          xf=yv;
        }else if(bV){
          const yv=cf[5]*xf+cf[6]*this.vx1+cf[7]*this.vx2-cf[8]*this.vy1-cf[9]*this.vy2;
          this.vx2=this.vx1; this.vx1=xf; this.vy2=this.vy1; this.vy1=yv; xf=yv;
        }
      }
      if(xf-xf!==0) xf=0;
      /* ═ the scope: lowpass -> dry ═ */
      const d0=cf[0]*xf+cf[1]*this.lx1+cf[2]*this.lx2-cf[3]*this.ly1-cf[4]*this.ly2;
      this.lx2=this.lx1; this.lx1=xf; this.ly2=this.ly1; this.ly1=d0;
      this.dryG+=(dryT-this.dryG)*k50; this.wetG+=(wetT-this.wetG)*k50; this.rg+=(rgT-this.rg)*k50;
      /* ═ wet: four diffusers, then eight lines through a Hadamard mix ═ */
      let rv=xf*0.3;
      const ar0=rv<0?-rv:rv; if(ar0>fPk) fPk=ar0;
      for(let j=0;j<4;j++){
        const k2=aOff[j]+aIdx[j], d=aBuf[k2], w=rv-0.6*d;
        rv=d+0.6*w; aBuf[k2]=w; if(++aIdx[j]>=aLen[j]) aIdx[j]=0;
      }
      for(let j=0;j<8;j++){
        const d=fBuf[fOff[j]+fIdx[j]], lpv=fLp[j]+(d-fLp[j])*fDamp;
        fLp[j]=lpv; fo[j]=lpv;
        const al=lpv<0?-lpv:lpv; if(al>fPk) fPk=al;
      }
      const wl=(fo[0]-fo[2]+fo[4]-fo[6])*0.5, wr=(fo[1]-fo[3]+fo[5]-fo[7])*0.5;
      for(let h=1;h<8;h<<=1){
        for(let a0=0;a0<8;a0+=h<<1){
          for(let b0=a0;b0<a0+h;b0++){ const s=fo[b0], t=fo[b0+h]; fo[b0]=s+t; fo[b0+h]=s-t; }
        }
      }
      for(let j=0;j<8;j++){
        fBuf[fOff[j]+fIdx[j]]=rv+fG[j]*fo[j]*0.35355339059327373;
        if(++fIdx[j]>=fLen[j]) fIdx[j]=0;
      }
      const inL=d0*this.dryG+wl*this.wetG, inR=d0*this.dryG+wr*this.wetG;
      /* r11's StereoPannerNode, stereo-input law */
      let oL, oR;
      if(neg){ oL=inL+inR*pA; oR=inR*pB; } else { oL=inL*pA; oR=inR+inL*pB; }
      /* ═ PHANTOM: the echoes fall backwards — two heads read 350 ms windows in reverse,
         crossfaded so they sum to one, fed back at 0.45 and laid over the dry ═ */
      {
        let c0=this.pc0, c1=this.pc1;
        const wp=this.pw;
        if(c0>=pW){ c0=0; this.pa0=wp>0?wp-1:pM-1; }
        if(c1>=pW){ c1=0; this.pa1=wp>0?wp-1:pM-1; }
        let r0=this.pa0-c0; if(r0<0) r0+=pM;
        let r1=this.pa1-c1; if(r1<0) r1+=pM;
        const w0=pwin[c0], w1=pwin[c1];
        const hl=pL[r0]*w0+pL[r1]*w1, hr=pR[r0]*w0+pR[r1]*w1;
        const il=oL+phFb*hl, ir=oR+phFb*hr;
        pL[wp]=il; pR[wp]=ir;
        const ai=(il<0?-il:il)+(ir<0?-ir:ir); if(ai>pPk) pPk=ai;
        this.pw=wp+1>=pM?0:wp+1; this.pc0=c0+1; this.pc1=c1+1;
        oL+=phMix*hl; oR+=phMix*hr;
      }
      /* ═ scope gain, then r11's limiter (its target re-read from the peak every 16 samples) ═ */
      oL*=this.rg; oR*=this.rg;
      const aL=oL<0?-oL:oL, aR=oR<0?-oR:oR, a=aL>aR?aL:aR;
      if(a>this.lpk) this.lpk=a;
      if(++this.lct>=16){ this.lgT=this.lpk>LIM_T?Math.pow(LIM_T/this.lpk,0.95):1; this.lpk=0; this.lct=0; }
      const gt=this.lgT;
      this.lg+=(gt-this.lg)*(gt<this.lg?this.lAtt:this.lRel);
      const g2=this.lg*LIM_MK; oL*=g2; oR*=g2;
      if(R){
        const cl=ceil1(oL), cr=ceil1(oR); L[i]=cl; R[i]=cr;
        const al=cl<0?-cl:cl, ar=cr<0?-cr:cr; if(al>peak) peak=al; if(ar>peak) peak=ar;
      }else{
        const c=ceil1(0.5*(oL+oR)); L[i]=c;
        const ac=c<0?-c:c; if(ac>peak) peak=ac;
      }
    }
    /* filter states: flush denormals and anything that is not a number, once a block */
    if(!fin(this.lx1)||!fin(this.ly1)||!fin(this.lx2)||!fin(this.ly2)){ this.lx1=0; this.lx2=0; this.ly1=0; this.ly2=0; }
    if(this.ly1<1e-15&&this.ly1>-1e-15) this.ly1=0; if(this.ly2<1e-15&&this.ly2>-1e-15) this.ly2=0;
    if(!fin(this.vy1)||!fin(this.vy2)){ this.vx1=0; this.vx2=0; this.vy1=0; this.vy2=0; }
    if(this.vy1<1e-15&&this.vy1>-1e-15) this.vy1=0; if(this.vy2<1e-15&&this.vy2>-1e-15) this.vy2=0;
    if(!fin(this.dx1)||!fin(this.dF1)){ this.dx1=0; this.dF1=0; }
    for(let j=0;j<8;j++){ const a=fLp[j]; if(!fin(a)||(a<1e-15&&a>-1e-15)) fLp[j]=0; }
    for(let v=0;v<NV;v++){ if(stage[v]===0){ const j=v*4; ns[j]=0; ns[j+1]=0; ns[j+2]=0; ns[j+3]=0; } }
    /* tails: hold the engine awake while an echo, a backwards echo or the reverb still rings */
    this.holdE=ePk>THR?this.eLen+N:(this.holdE>N?this.holdE-N:0);
    this.holdP=pPk>THR?2*pW+N:(this.holdP>N?this.holdP-N:0);
    this.holdF=fPk>THR?this.fHold+N:(this.holdF>N?this.holdF-N:0);
    let any=(droneOn||this.dEnv>0||anyS||this.recAct>0||this.holdE>0||this.holdP>0||this.holdF>0)?1:0;
    if(!any) for(let v=0;v<NV;v++) if(stage[v]){ any=1; break; }
    this.quiet=(!any&&peak<THR)?this.quiet+1:0;
  }
}
registerProcessor(PROC, UsrGlitchDial);
`;

/* ═════════════════════════════════════════════════════════════════════════
   1 · HOST DETECTION — now the shared header above (SRCD_HOSTED, srcdAdmit,
   srcdUp, srcdOnlyOurParent). r11's HOSTED / weaveTrusted / esc() went with
   the weave protocol: nothing from outside is written as markup any more.
   ═════════════════════════════════════════════════════════════════════════

   ═════════════════════════════════════════════════════════════════════════
   2 · THΞ RΛCK — power, mount, and the one wire to the worklet
   ═════════════════════════════════════════════════════════════════════════
   r11 announced itself up the srcd-omni tier as a weave page (hello / ident
   with accent #39FFB4, weave-status on every change). Racked as a module,
   that recoloured the enclosure and gave it a status row it should not have.
   r12 speaks srcd-duo only, through srcdUp, and owns no colour up there.
   The face keeps every control's value in state.p (the P table), sends it on
   change, and sends all of it again whenever the engine comes up. */
const state = { p: P.map(q => q.d) };
const PIX = Object.fromEntries(P.map((q, i) => [q.k, i]));   /* 'tun' → 1 … */
let ctx = null, node = null, powered = false, bootP = null, engineRate = 0;
const send = (...m) => { if(node) node.port.postMessage(m); };
function setP(k, v){   /* by key ('tun') or by index (ST0 + step) */
  const i = typeof k === 'number' ? k : PIX[k], q = P[i];
  if(!q) return;
  v = Math.max(q.min, Math.min(q.max, +v));
  if(!(v === v) || state.p[i] === v) return;
  state.p[i] = v; send('p', i, v);
}

/* ═ HØSTΞD: the rack owns the node ═ the worklet SOURCE goes up as text; the rack registers it
   in the enclosure's one AudioContext and hands back a port that relays through it.
   30 s to answer, extended by wl-progress up to 90 s; a refusal or a silence FΛILS CLØSΞD —
   this page never builds a second AudioContext under a rack. */
function srcdMount(o){
  return new Promise((res, rej)=>{
    const t0=Date.now(); let deadline=t0+30000;
    let to=setTimeout(function tick(){
      if(Date.now()>=deadline){ window.removeEventListener('message', h); rej(new Error('the rack did not answer wl-mount in 30 s')); }
      else to=setTimeout(tick, 1000);
    }, 1000);
    function h(e){
      if (window.parent !== window && !srcdAdmit(e)) return;
      const d=e.data;
      if(!d || d.src!=='srcd-duo' || d.mod!==SRCD_MOD) return;
      if(d.cmd==='wl-ready'){
        clearTimeout(to); window.removeEventListener('message', h);
        const proxy={ port:{ postMessage(m){ srcdUp({src:'srcd-duo', cmd:'wl-send', mod:SRCD_MOD, m}); }, onmessage:null } };
        res({ node:proxy, sr:d.sr });
      } else if(d.cmd==='wl-fail'){
        clearTimeout(to); window.removeEventListener('message', h); rej(new Error(d.err || 'the rack refused the worklet'));
      } else if(d.cmd==='wl-progress'){
        if(Date.now()-t0<90000) deadline=Date.now()+30000;
      }
    }
    window.addEventListener('message', h);
    srcdUp(Object.assign({src:'srcd-duo', cmd:'wl-mount', mod:SRCD_MOD,
      preferRate:SRCD_RATES.prefer, minRate:SRCD_RATES.min, maxRate:SRCD_RATES.max}, o));
  });
}
async function srcdBoot(){
  if(SRCD_HOSTED){
    const r=await srcdMount({ source:WORKLET_SRC, processor:PROC, opts:{} });
    return { ctx:null, node:r.node, sr:r.sr };
  }
  /* standalone: our own context, made on the gesture that powers us */
  const c=new (window.AudioContext||window.webkitAudioContext)({ latencyHint:'interactive' });
  const url=URL.createObjectURL(new Blob([WORKLET_SRC], {type:'application/javascript'}));
  try{ await c.audioWorklet.addModule(url); } finally{ URL.revokeObjectURL(url); }
  const n=new AudioWorkletNode(c, PROC, { outputChannelCount:[2] });
  n.onprocessorerror=()=>{ statusText.textContent = '✕ the engine stopped — its processor threw'; };
  n.connect(c.destination);
  if(c.state!=='running'){ try{ await c.resume(); }catch(_){} }
  return { ctx:c, node:n, sr:c.sampleRate };
}
function pwrPaint(){ const b=document.getElementById('pwr'); b.classList.toggle('on', powered); b.setAttribute('aria-pressed', powered?'true':'false'); }
function pwrSay(){ srcdUp({ src:'srcd-duo', cmd:'pwr-state', mod:SRCD_MOD, on:powered }); }
/* every caller waits on the same boot, so the key that powered us still sounds */
function powerOn(){
  if(powered) return Promise.resolve();
  if(bootP) return bootP;
  bootP = (async () => {
    statusText.textContent = SRCD_HOSTED ? 'POWER · mounting in the rack…' : 'POWER · starting…';
    try{
      const r = await srcdBoot();
      ctx = r.ctx; node = r.node; engineRate = +r.sr || SRCD_RATES.prefer; powered = true;
      node.port.onmessage = e => fromWorklet(e && e.data);
      for(let i = 0; i < NP; i++) send('p', i, state.p[i]);
      for(const [slot, s] of SAMPLES) if(s.data) send('smp', 'load', slot, s.data, s.sr);
      radarApply();   /* as r11 did when its audio came up: the readout names the active point */
      /* warm the engine: it sleeps when silent, so the first real key would run the voice, reverb and limiter code cold
         and crackle. A clean-DTMF note ~94 dB down (inaudible) wakes that code, then lets go; the worklet is untouched */
      send('on', 60, 0.00002, 2); setTimeout(() => send('off', 60, 2), 400);
      statusText.textContent = (SRCD_HOSTED ? 'LIVE · RACK · ' : 'LIVE · ') + (Math.round(engineRate / 100) / 10) + ' kHz';
    }catch(err){
      statusText.textContent = '✕ ' + String(err && err.message || err);
    }finally{ bootP = null; pwrPaint(); pwrSay(); }
  })();
  return bootP;
}
function powerOff(){
  if(!powered) return;
  if(node && node.port) node.port.onmessage = null;   /* its panic echo must not clear DRONE / PHANTOM / STUTTER */
  send('panic');
  if(SRCD_HOSTED) srcdUp({ src:'srcd-duo', cmd:'wl-kill', mod:SRCD_MOD });
  else if(ctx){ try{ ctx.close(); }catch(_){} }
  ctx = null; node = null; powered = false;
  faceQuiet(); pwrPaint(); pwrSay();
  statusText.textContent = 'STANDBY · ' + (SRCD_HOSTED ? 'HOSTED' : 'STANDALONE');
}
/* r11 started its audio on the first key / glyph / slot gesture — kept STANDALONE, where the browser wants
   that gesture. In a rack the enclosure owns the AudioContext and its ⏻ (tap-power) is the gesture, and a
   module that is off makes no sound: a key, glyph, slot or PLAY does not wake it. Every caller already
   checks `powered` after the await, so each simply does nothing while the module is off. */
function autoPower(){ return (powered || SRCD_HOSTED) ? Promise.resolve() : powerOn(); }

/* what the worklet says back (r14): whether the loop runs and the step it is on
   (the rack's transport lands there too), each slot's state, a finished take, a panic */
function fromWorklet(m){
  if(!m || !m.length) return;
  const c = m[0];
  if(c === 'st'){ const k = m[1] | 0; if(k >= 0 && k < 16) onStep(k); }
  else if(c === 'run') setRunning(!!m[1]);
  else if(c === 'sl'){ const i = m[1] | 0, s = m[2] | 0; if(i >= 0 && i < 8 && s >= 0 && s <= 5) onSlot(i, s); }
  else if(c === 'panic') panicFace();
  else if(c === 'smp' && m[1] === 'buf'){
    const slot = m[2] | 0, data = m[3];
    if(!(slot >= 0 && slot < 8)) return;
    if(data instanceof Float32Array && data.length > 1){ slotSt[slot] = 1; loadSample(slot, data, +m[4] || engineRate, `rec ${slot + 1}`, true); }
    else { slotSt[slot] = 0; SAMPLES.delete(slot); statusText.textContent = `slot ${slot + 1} · record failed`; }
    paintSlot(slot); paintDot();
  }
}

/* ═════════════════════════════════════════════════════════════════════════
   3 · AUDIO CONTEXT ACQUISITION — r11's ensureAudio(), srcdEnclosureBus
   adoption and the page-side node graph are gone: under a rack the context
   is the enclosure's and only wl-mount reaches it (§2); standalone, powerOn()
   builds one. The graph itself is WORKLET_SRC.
   ═════════════════════════════════════════════════════════════════════════ */

/* ═════════════════════════════════════════════════════════════════════════
   4 · DTMF FREQUENCY TABLES
   ═════════════════════════════════════════════════════════════════════════
   The 4×4 ITU matrix: 4 row frequencies × 4 column frequencies = 16 tones.
   Each button is the intersection of one row and one column freq. Pressing
   a button sounds BOTH simultaneously — that is what makes DTMF a DTMF.

   ROWS: 697, 770, 852, 941 Hz   (the "vertical" group)
   COLS: 1209, 1336, 1477         (the "horizontal" group; the 4th col 1633
                                  was reserved for military A/B/C/D modifiers
                                  — removed in r09, replaced by orbiting glyphs) */
const DTMF_ROWS  = [697, 770, 852, 941];
const DTMF_COLS  = [1209, 1336, 1477];
const DTMF_LABELS = ['1','2','3',
                     '4','5','6',
                     '7','8','9',
                     '*','0','#'];

/* ═ ALIEN-01 · xenotype-flavoured extension bank ═
   Non-equal-temperament rows/cols — ratios drawn from a stretched harmonic
   series rather than 12-TET, so intervals land audibly "off" from a human
   ear without being random. Cols pushed high and non-integer-related to
   the rows on purpose: no pair of buttons should coincide with a familiar
   consonant interval. Flavour is sonic (the tuning itself), not textual —
   glyphs are geometric, not con-lang characters. */
const ALIEN_01_ROWS = [303, 411, 587, 799];
const ALIEN_01_COLS = [1810, 2093, 2416];
const ALIEN_01_LABELS = ['⟁','⟡','⬡',
                          '◬','◭','◮',
                          '⟒','⟓','⟔',
                          '⧫','⧬','⧭'];

/* CUSTOM — user-tunable bank. Starts as a copy of ITU; phase 9 (config
   panel) will let a person drag/retype these values. Kept as live-editable
   arrays (not a fresh object each time) so a future editor can mutate them
   in place and call setTuning('custom') to push a rebuild.
   r14: that editor is CFG — ROW HZ, COL HZ and RATIO (P rows crw ccl cst):
   row r = ROW HZ × RATIO^r, column c = COL HZ × RATIO^c, the worklet working
   out the same. The defaults (697, 1209, ×1.105) land within a hertz of ITU. */
const CUSTOM_ROWS   = DTMF_ROWS.slice();
const CUSTOM_COLS   = DTMF_COLS.slice();
const CUSTOM_LABELS = DTMF_LABELS.slice();
function applyCustomBank(){
  const a = state.p[PIX.crw], b = state.p[PIX.ccl], s = state.p[PIX.cst];
  for(let r = 0; r < CUSTOM_ROWS.length; r++) CUSTOM_ROWS[r] = a * Math.pow(s, r);
  for(let c = 0; c < CUSTOM_COLS.length; c++) CUSTOM_COLS[c] = b * Math.pow(s, c);
  if(currentTuning === 'custom') paintKeyHz();
}

const TUNINGS = new Map([
  ['itu',      {rows: DTMF_ROWS,      cols: DTMF_COLS,      labels: DTMF_LABELS}],
  ['alien-01', {rows: ALIEN_01_ROWS,  cols: ALIEN_01_COLS,  labels: ALIEN_01_LABELS}],
  ['custom',   {rows: CUSTOM_ROWS,    cols: CUSTOM_COLS,    labels: CUSTOM_LABELS}]
]);

let currentTuning = 'itu';

/* activeRows/activeCols/activeLabels return the freq/label arrays for the
   CURRENT tuning selection. Every engine, the grid builder, and the pattern
   recorder read through these three functions rather than the raw consts,
   so swapping TUNING never requires touching engine or UI code. */
function activeRows(){ return TUNINGS.get(currentTuning).rows; }
function activeCols(){ return TUNINGS.get(currentTuning).cols; }
function activeLabels(){ return TUNINGS.get(currentTuning).labels; }

/* setTuning — swap banks and rebuild the grid. Any voices currently held
   are left alone (their frequencies were already captured at press-time);
   only the button layout and future presses change. */
function setTuning(key){
  if(!TUNINGS.has(key)) return;
  currentTuning = key;
  document.body.classList.toggle('alien-mode', key !== 'itu');
  buildGrid();
  statusText.textContent = 'TUNING ' + key.toUpperCase();
  setP('tun', [...TUNINGS.keys()].indexOf(key));   /* itu 0 · alien-01 1 · custom 2 — the worklet holds the same banks */
}

/* ═════════════════════════════════════════════════════════════════════════
   5 · TONE GENERATION ENGINES — in WORKLET_SRC now
   ═════════════════════════════════════════════════════════════════════════
   r11's dtmfVoice() and ENGINES map are the worklet's four engines, at r11's
   levels and envelopes (exp attack 8 ms, release tau 50 ms):
     DTMF  row + column sines · 0.18 (TWIST sets their balance)
     FM    column modulates row at depth rf*1.5 Hz · 0.2
     NOISE 0.4 s band-passed burst, centre rf, Q max(0.5, cf/rf) · 0.22
     WARP  ring mod, sum and difference only · 0.25
   A key is ['on', 60 + idx, 1] / ['off', 60 + idx]; ENGINE is P row 'eng'.
   r14: the sequence (PATTERN and STEP alike) plays on the selected engine, as
   r11's STEP did; ATTACK and RELEASE (CFG) set the envelope, 7 ms / 49 ms at
   their defaults — r11's. */

/* BUTTONS — held keys by button index → the note the worklet is holding. */
const BUTTONS = new Map();   /* idx → note (60 + idx) */

/* which engine a press uses — the ENGINE selector, in the worklet's order */
const ENGINE_KEYS = ['dtmf', 'fm', 'noise', 'warp'];
let currentEngine = 'dtmf';

/* ═════════════════════════════════════════════════════════════════════════
   6 · CIRCUIT-BENDING & FX LAYER — in WORKLET_SRC now
   ═════════════════════════════════════════════════════════════════════════
   r11 rebuilt a node chain between masterGain and the scope on every BEND
   change. The worklet runs the same stages in the same order: drive (the
   tanh 8 WaveShaper curve, 2x), glitch (4 bit) then crush (hold 12) from
   the old bitcrusher worklet — folded in, one processor per module — echo
   (250 ms, fb 0.4) and vacuum (lowpass Q 8 dB swept 800 ± 400 Hz at 0.3 Hz).
   The selector names one of BEND_KEYS, sent as P row 'bnd'.
   r14: AMOUNT (CFG) sets how hard each stage bends — those numbers are its
   setting at 50%: drive tanh 1–15x (anti-aliased), glitch 6–2 bits held 1–23
   samples, echo feedback 0.2–0.6, vacuum swept ± 0–800 Hz at Q 0–8 dB. */
const BEND_KEYS = ['clean', 'drive', 'glitch', 'full', 'echo', 'vacuum'];
let currentBend = 'clean';
function applyBend(level){
  currentBend = level;
  setP('bnd', Math.max(0, BEND_KEYS.indexOf(level)));
}

/* ═════════════════════════════════════════════════════════════════════════
   7 · SAMPLE HANDLING
   ═════════════════════════════════════════════════════════════════════════
   Sample buttons could source material from three places. Checked against
   the real enclosure — only the first two have anything to actually talk to:
     1. Recorded loops — capture from THIS page's own macro-grid performance
        into an AudioBuffer, loop it. Fully local, no enclosure needed.
     2. Rendered buffers — OfflineAudioContext render of a PATTERN (§9),
        stored. Also fully local.
     3. Live per-module chassis audio taps — NOT currently possible.
        omni_frame.html has no 'audio-tap' command anywhere; the only shared
        audio path a weave page has is the summed enclosure bus (§3), which
        mixes every rack together, not one isolated module. Genuinely
        implementing this would mean adding a tap command to the enclosure
        itself, not something this page can conjure on its own — left as an
        honest open question rather than a fake protocol call.

   Stub: slots toggle ARMED only. Full implementation TODO phase 4.

   IMPLEMENTED r04 (paths 1 and 2 only — real, buildable against what exists):

   Path 1 — RECORD FROM MASTER: captures whatever this page is playing (macro
   grid, pattern playback, even FX output) via a MediaStreamDestination tap
   off masterGain + MediaRecorder. Short-press a slot while in RECORD mode to
   grab 2 seconds of whatever you're dialing.

   Path 2 — RENDER PATTERN: renders a recorded PATTERN (§9) through an
   OfflineAudioContext using the same dtmfVoice shape, producing a reusable
   AudioBuffer you can loop from a slot. Long-press a slot while a PATTERN is
   loaded to render it into that slot.

   Path 3 (chassis taps) remains honestly unimplemented — see the note above.

   r12: the slots play inside the worklet. Path 1 is the worklet recording
   its own LEVEL output (where r11 tapped masterGain) and handing the take
   back; path 2 sums r11's clean-DTMF voice straight into a buffer, with no
   OfflineAudioContext. The page keeps every take and re-loads them into the
   engine on each power-up.
   r14: the worklet says what each slot is doing ('sl') and the face paints
   that, no timers of its own. While the loop runs, a slot waits for its
   downbeat: a hold ARMS it to record one bar from there, a tap CUES it to
   start there; stopped, both happen at once (a take lasts 2 s, as r11's). */

const SAMPLES = new Map();   /* slot → {data: Float32Array, sr, label, source, loop} — the face's copy */
const slotSt = new Uint8Array(8);   /* the worklet's word: 0 empty 1 ready 2 playing 3 recording 4 armed 5 cued */
const SLOT_CLS = ['', 'loaded', 'playing', 'recording', 'armed', 'cued'];
const REC_DUR_MS = 2000;     /* default recording window */

/* a take or a render becomes the slot; fromEngine: the worklet holds it already */
function loadSample(slot, data, sr, label, fromEngine){
  SAMPLES.set(slot, {
    data, sr, label: label || ('slot ' + (slot + 1)),
    source: fromEngine ? 'self-record' : 'pattern-render', loop: true
  });
  if(!fromEngine) send('smp', 'load', slot, data, sr);   /* a new take replaces the old one, stopped */
  paintSlot(slot);
  statusText.textContent = `slot ${slot + 1} · loaded (${(data.length / sr).toFixed(1)}s)`;
}
function paintSlot(slot){
  const el = sampleEl.querySelector('[data-slot="' + slot + '"]');
  if(!el) return;
  const st = slotSt[slot] || (SAMPLES.has(slot) ? 1 : 0);
  el.classList.remove('loaded', 'playing', 'recording', 'armed', 'cued');
  if(SLOT_CLS[st]) el.classList.add(SLOT_CLS[st]);
}
function paintSlots(){ for(let i = 0; i < 8; i++) paintSlot(i); paintDot(); }
/* the status dot goes magenta while a take is recording, as r11's did */
function paintDot(){
  let rec = false;
  for(let i = 0; i < 8; i++) if(slotSt[i] === 3) rec = true;
  dot.style.background = rec ? 'var(--bend)' : '';
  dot.style.boxShadow = rec ? '0 0 10px var(--bend)' : '';
}
/* 'sl' — a slot changed: a finished take is fetched for the face to keep */
function onSlot(i, st){
  const was = slotSt[i];
  slotSt[i] = st;
  if(was === 3 && st === 1) send('smp', 'get', i);
  else if(was === 3 && st === 0){ SAMPLES.delete(i); statusText.textContent = `slot ${i + 1} · record failed`; }
  if(st !== was){
    if(st === 4) statusText.textContent = `slot ${i + 1} · ARMED · one bar from the downbeat`;
    else if(st === 3) statusText.textContent = `slot ${i + 1} · REC ${running ? 'one bar' : REC_DUR_MS + 'ms'}`;
    else if(st === 5) statusText.textContent = `slot ${i + 1} · cued for the downbeat`;
    else if(st === 2) statusText.textContent = `slot ${i + 1} · playing`;
  }
  paintSlot(i); paintDot();
}
async function playSample(slot){
  const s = SAMPLES.get(slot);
  if(!s && !slotSt[slot]) return;
  await autoPower();
  if(!powered) return;
  send('smp', 'start', slot);               /* looped, from the top — on the downbeat while the loop runs */
}
function stopSample(slot){
  send('smp', 'stop', slot);
}
/* a tap: loop it, stop it, end the take now, or call off an armed one */
function slotTap(slot){
  const st = slotSt[slot];
  if(st === 2 || st === 5){ stopSample(slot); statusText.textContent = `slot ${slot + 1} · stopped`; }
  else if(st === 3){ send('smp', 'get', slot); }
  else if(st === 4){
    send('smp', 'clr', slot);
    const s = SAMPLES.get(slot); if(s) send('smp', 'load', slot, s.data, s.sr);
    statusText.textContent = `slot ${slot + 1} · disarmed`;
  }
  else if(st === 1 || SAMPLES.has(slot)){ playSample(slot); }
  else { statusText.textContent = `slot ${slot + 1} · empty · hold to record`; }
}

/* RECORD FROM MASTER — the worklet records its own LEVEL output (r11's
   masterGain tap) and says when the take is done ('sl'); the take then
   comes back on 'get' through fromWorklet() → loadSample(). */
async function recordFromMaster(slot, durationMs){
  await autoPower();
  if(!powered) return;
  send('smp', 'rec', slot, durationMs / 1000);
}

/* RENDER PATTERN TO BUFFER — r11 scheduled its clean-DTMF voice into an
   OfflineAudioContext; r12 sums that same voice straight into a buffer (no
   audio context of any kind under a rack): two sines, 0.0001 → 0.18 in an
   8 ms exponential ramp, held, released on tau 50 ms, cut 300 ms after the
   hit, all ×0.8. Works powered or not.
   r14: the pattern is the loop's sixteen steps; the buffer is exactly one
   bar and a tail runs on round its start, so the slot loops in time. */
async function renderPatternToBuffer(slot){
  const hits = patternFromSteps();
  if(!hits.length){ statusText.textContent = 'no pattern to render'; return; }
  const rows = activeRows(), cols = activeCols();
  let barMs = 0;
  for(let k = 0; k < 16; k++) barMs += stepMs(k);
  const rate = engineRate || SRCD_RATES.prefer;
  const len = Math.max(2, Math.round(barMs / 1000 * rate));
  const out = new Float32Array(len);
  statusText.textContent = `slot ${slot + 1} · rendering...`;
  const nA = Math.round(0.008 * rate), ka = Math.pow(1800, 1 / nA), kr = Math.exp(-1 / (0.05 * rate));
  for(const h of hits){
    const r = Math.floor(h.idx / cols.length), c = h.idx % cols.length;
    if(!rows[r] || !cols[c]) continue;
    const dur = h.dur / 1000, nD = Math.round(dur * rate);
    const i0 = Math.round(h.t / 1000 * rate), nT = Math.min(len, Math.round((dur + 0.3) * rate));
    const wr = 2 * Math.PI * rows[r] / rate, wc = 2 * Math.PI * cols[c] / rate;
    let g = 0.0001, e = 0.18 - 0.0001;
    for(let n = 0; n < nT; n++){
      const v = n < nA ? g : (n < nD ? 0.18 : 0.0001 + e);
      out[(i0 + n) % len] += 0.8 * v * (Math.sin(wr * n) + Math.sin(wc * n));
      if(n < nA) g *= ka; else if(n >= nD) e *= kr;
    }
  }
  loadSample(slot, out, rate, `pattern ${slot + 1}`);
}

/* record mode flag — when true, tapping a slot records from master instead
   of playing. Set by a long-press on a slot; cleared by tapping again. */
let slotRecordMode = -1;   /* -1 = none, slot idx = that slot is in record mode */

/* ═════════════════════════════════════════════════════════════════════════
   8 · DATA-ROW INTEGRATION — none in r12
   ═════════════════════════════════════════════════════════════════════════
   targets / glitch-event / score-part were weave-page traffic on srcd-omni
   (and glitch-event never had a listener in the enclosure). A rack module
   has no data-row channel in SRC-D r158, so this page sends none of it; the
   rack's transport, MIDI and tempo arrive the module way (§2, §11). */

/* ═════════════════════════════════════════════════════════════════════════
   9 · PATTERN RECORDER · STEP SEQUENCER — the engine's sixteen steps (r14)
   ═════════════════════════════════════════════════════════════════════════
   currentMode drives what a dialled key does beyond sounding:
     LIVE    → nothing more: it just plays
     PATTERN → recording: the key is written into the loop. The first hit
               starts the loop on its downbeat; while it runs, a hit lands on
               the step it fell in, or past that step's half-way, the next one
     STEP    → the key toggles itself on the step under the cursor (← → or a
               tap on a step cell), as r11's grid did

   r11 kept PATTERN as timestamps and played them back, and STEP, on page
   timers. r14's sequence lives in the worklet — P rows s01–s16, 0 a rest,
   1–12 a key — counted on the worklet's own sample clock, so the rack's
   transport and its atTime land on the sample and a late start joins the
   rack's bar where it is. PLAY (or SPACE outside LIVE) runs and stops it;
   the worklet says back when it runs ('run') and each step it plays ('st').
   EXPORT saves the loop as r11's pattern data ({t, idx, dur} in ms, worked
   out from the steps, the BPM, GATE and SWING) plus the steps themselves. */

let currentMode = 'live';
const ST0 = PIX.s01;          /* P index of step 1 */
let stepEdit = 0;             /* which step is being edited (cursor) */
let running = false;          /* the worklet's transport, as it last said */
let playhead = -1;            /* the step it is on; -1 stopped */
let lastStepAt = 0;           /* performance.now() when that step began */
let startReq = false;         /* PLAY sent, the worklet not yet answered */
const pending = new Map();    /* PATTERN hits waiting for their step to pass: step → key idx */
const preRoll = [];           /* PATTERN hits before the loop answered (the engine booting): [ms, idx] */

const stepVal = k => Math.round(state.p[ST0 + k]);
function hasSteps(){ for(let k = 0; k < 16; k++) if(stepVal(k) > 0) return true; return false; }
/* a step's length in ms, as the worklet counts it: sixteenths at BPM, SWING
   lengthening the even ones and shortening the odd */
function stepMs(k){
  const L = 60000 / state.p[PIX.bpm] / 4, sw = state.p[PIX.swg];
  return (k & 1) ? L * (1 - sw) : L * (1 + sw);
}
function setStep(k, v){ setP(ST0 + k, v); paintSteps(); }
function paintSteps(){ paintStepGrid(); paintRing(); updatePlayButton(); }

/* STEP: the key toggles itself at the cursor */
function toggleStepAtCursor(buttonIdx){
  if(currentMode !== 'step') return;
  setStep(stepEdit, stepVal(stepEdit) === buttonIdx + 1 ? 0 : buttonIdx + 1);
}
/* PATTERN: the key is written where the loop is. A hit already heard live
   is not played again on the step it lands on: written past half-way it
   waits (pending) until the worklet has passed that step. Hits before the
   loop has started (the first one starts it, and the engine may still be
   booting) keep their spacing: the first lands on the downbeat */
async function patternHit(idx){
  if(currentMode !== 'pattern') return;
  if(!running){
    preRoll.push([performance.now(), idx]);
    if(!startReq){
      startReq = true;
      await autoPower();
      if(powered) send('play', 1); else { startReq = false; preRoll.length = 0; }
    }
    return;
  }
  if(playhead >= 0 && performance.now() - lastStepAt < stepMs(playhead) * 0.5) setStep(playhead, idx + 1);
  else pending.set((playhead + 1) & 15, idx);
}
/* the loop's first step is here: the pre-roll goes down from it, a sixteenth apart */
function placePreRoll(k){
  const t0 = preRoll[0][0], L = 60000 / state.p[PIX.bpm] / 4;
  for(const [t, i] of preRoll){
    const s = (k + Math.min(15, Math.round((t - t0) / L))) & 15;
    if(s === k) setP(ST0 + s, i + 1); else pending.set(s, i);
  }
  preRoll.length = 0;
}

/* PLAY · STOP — the face's transport; the rack's arrives at the worklet itself */
async function togglePlay(){
  if(running){ send('play', 0); return; }
  await autoPower();
  if(!powered) return;
  startReq = true;
  send('play', 1);
}
/* 'run' — the loop started or stopped, whoever asked */
function setRunning(r){
  running = r; startReq = false;
  if(!r){ playhead = -1; pending.clear(); preRoll.length = 0; seqGlowsOff(); sweepFree(); }
  paintPlay(); paintSteps();
  statusText.textContent = loopWord(r);
}
function loopWord(r){ return currentMode.toUpperCase() + ' · ' + Math.round(state.p[PIX.bpm]) + 'bpm · ' + (r ? 'playing' : 'stopped'); }
/* 'st' — the worklet has just played step k */
const seqTimers = new Array(12).fill(0);
function onStep(k){
  playhead = k; lastStepAt = performance.now();
  if(preRoll.length) placePreRoll(k);
  if(pending.has(k)){ const i = pending.get(k); pending.delete(k); setP(ST0 + k, i + 1); }
  const v = stepVal(k);
  if(v > 0) seqGlow(v - 1, Math.max(50, stepMs(k) * state.p[PIX.gat]));
  paintSteps();
}
/* the key a step plays lights for its gate (PHANTOM hides it — see the CSS) */
function seqGlow(i, ms){
  const b = gridEl.children[i]; if(!b) return;
  b.classList.add('seq');
  clearTimeout(seqTimers[i]);
  seqTimers[i] = setTimeout(() => { const e = gridEl.children[i]; if(e) e.classList.remove('seq'); }, ms);
}
function seqGlowsOff(){
  for(let i = 0; i < 12; i++){ clearTimeout(seqTimers[i]); seqTimers[i] = 0; }
  gridEl.querySelectorAll('.macro.seq').forEach(b => b.classList.remove('seq'));
}

/* the loop as r11's pattern data: {t, idx, dur} in ms from the downbeat */
function patternFromSteps(){
  const out = [], gate = state.p[PIX.gat];
  let t = 0;
  for(let k = 0; k < lenN(); k++){
    const v = stepVal(k), d = stepMs(k);
    if(v > 0) out.push({ t: Math.round(t * 10) / 10, idx: v - 1, dur: Math.round(d * gate * 10) / 10 });
    t += d;
  }
  return out;
}
function exportPattern(){
  /* r11 handed this to the data row (glitch-event — no listener there yet).
     A rack module has no data-row channel, so the same well-formed pattern
     + tuning is saved as a file instead — r14 adds the steps and the tempo. */
  const pattern = patternFromSteps(), steps = [];
  for(let k = 0; k < 16; k++) steps.push(stepVal(k));
  const blob = new Blob([JSON.stringify({ kind: 'pattern', pattern, tuning: currentTuning,
    steps, length: lenN(), bpm: state.p[PIX.bpm], gate: state.p[PIX.gat], swing: state.p[PIX.swg], engine: currentEngine })], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'glitch_dial_pattern.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  statusText.textContent = `EXPORTED · ${pattern.length} hits`;
}
/* CFG's RANDOM and CLEAR */
function randomSteps(){
  for(let k = 0; k < 16; k++) setP(ST0 + k, (k === 0 || Math.random() < 0.42) ? 1 + Math.floor(Math.random() * 12) : 0);
  pending.clear(); paintSteps();
  statusText.textContent = 'SEQUENCE · a random number dialled';
}
function clearSteps(){
  for(let k = 0; k < 16; k++) setP(ST0 + k, 0);
  pending.clear(); paintSteps();
  statusText.textContent = 'SEQUENCE · cleared';
}

/* ═ STEP MØDΞ — 16-step grid sequencer ═
   Instead of free-timing, STEP mode quantizes the grid into 16 steps. Tapping
   a macro button toggles it on the current step; the playhead cycles the
   steps at a BPM. The step grid is drawn as a thin row of 16 cells below the
   macro grid, visible only in STEP mode. Left/right arrows move the edit
   cursor; the playhead highlights the step the worklet is playing. */

function paintStepGrid(){
  const row = document.getElementById('step-row');
  if(!row) return;
  if(currentMode !== 'step'){ row.style.display = 'none'; return; }
  row.style.display = 'grid';
  const labels = activeLabels();
  for(let i = 0; i < 16; i++){
    const cell = row.children[i];
    if(!cell) continue;
    const v = stepVal(i);
    cell.classList.toggle('active', v > 0);
    cell.classList.toggle('cursor', i === stepEdit);
    cell.classList.toggle('playhead', i === playhead && running);
    cell.classList.toggle('out', i >= lenN());
    const t = 'STEP ' + (i + 1) + (v > 0 ? ' · ' + labels[v - 1] : ' · rest');
    if(cell.title !== t) cell.title = t;
  }
}

function buildStepGrid(){
  let row = document.getElementById('step-row');
  if(row) return;
